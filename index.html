<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
    }

    .header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .chat {
      background: #2563eb;
      color: white;
    }

    .games {
      background: #16a34a;
      color: white;
    }

    .trending {
      background: #f59e0b;
      color: white;
    }

    .scores {
      background: #7c3aed;
      color: white;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>BigVic Fun 🎉</h1>
    <p>Chat • Games • Trending • Scores</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>Welcome to BigVic Fun 👋</h2>

      <p>
        Have fun, chat and play games.
      </p>

      <button
        class="chat"
        onclick="window.location.href='/chat/'">
        💬 Chat
      </button>

      <button
        class="games"
        onclick="alert('Games coming soon!')">
        🎮 Games
      </button>

      <button
        class="trending"
        onclick="alert('Trending coming soon!')">
        🔥 Trending
      </button>

      <button
        class="scores"
        onclick="alert('Scores coming soon!')">
        🏆 Scores
      </button>
    </div>

  </div>

</body>
</html>
