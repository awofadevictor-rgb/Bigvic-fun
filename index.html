<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 15px;
      margin-bottom: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .center {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .chat {
      background: #2563eb;
      color: white;
    }

    .games {
      background: #16a34a;
      color: white;
    }

    .trending {
      background: #f59e0b;
      color: white;
    }

    .scores {
      background: #7c3aed;
      color: white;
    }

    .game {
      background: #0ea5e9;
      color: white;
    }

    .back {
      background: #6b7280;
      color: white;
    }

    .page {
      display: none;
    }

    #homePage {
      display: block;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 8px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .result {
      text-align: center;
      font-weight: bold;
      font-size: 17px;
      margin-top: 15px;
    }

    .post {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .post-name {
      font-weight: bold;
    }

    .post-text {
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .post-time {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px 10px;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>Big
