<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:white;
  text-align:center;
}
header{
  padding:30px 20px;
  background:linear-gradient(135deg,#15152b,#24245c);
}
h1{font-size:42px;margin:10px 0;color:#00e5ff}
p{color:#ccc}
button{
  border:0;
  border-radius:12px;
  padding:14px 24px;
  margin:8px;
  font-size:16px;
  font-weight:bold;
}
.join{background:#00e5ff;color:#061018}
.card{
  margin:25px auto;
  padding:25px;
  max-width:500px;
  background:#151520;
  border-radius:18px;
}
.features{
  display:grid;
  gap:15px;
  max-width:600px;
  margin:20px auto;
}
.feature{
  background:#181824;
  padding:20px;
  border-radius:15px;
}
footer{
  margin-top:40px;
  padding:20px;
  color:#888;
}
</style>
</head>

<body>

<header>
<h1>BigVic Fun</h1>
<p>Chat • Games • Trending • Fun</p>
<button class="join" onclick="alert('Welcome to BigVic Fun!')">
Join BigVic Fun
</button>
</header>

<div class="card">
<h2>Welcome 👋</h2>
<p>Connect with people, chat, discover games and enjoy BigVic Fun.</p>
</div>

<div class="features">
<div class="feature">💬 <h3>Chat</h3><p>Talk and connect with other users.</p></div>
<div class="feature">🎮 <h3>Games</h3><p>Enjoy fun games and challenges.</p></div>
<div class="feature">🔥 <h3>Trending</h3><p>Discover what's popular on BigVic Fun.</p></div>
</div>

<footer>
© 2026 BigVic Fun
</footer>

</body>
</html>
