<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10102b;
      color: white;
    }

    header {
      background: #1d1d45;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #00d9ff;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .username-box {
      background: #1d1d45;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .username-box input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #555577;
      border-radius: 8px;
      background: #292955;
      color: white;
      font-size: 16px;
    }

    .username-box button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #00d9ff;
      color: #111122;
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      color: #66ff99;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      background: #18183a;
      border-radius: 12px;
      padding: 15px;
    }

    .message {
      background: #292955;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .sender {
      color: #00d9ff;
      font-weight: bold;
    }

    .text {
      margin-top: 5px;
      word-break: break-word;
    }

    .send {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #555577;
      border-radius: 8px;
      background: #292955;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      padding: 14px 18px;
      border: 0;
      border-radius: 8px;
      background: #ffcc33;
      color: #111122;
      font-weight: bold;
    }

    .logout {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #333355;
      color: white;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>BigVic Fun 💬</h1>
</header>

<div class="container">

  <!-- Username -->
  <div id="usernameBox" class="username-box">

    <div>Choose your chat name</div>

    <input
      id="usernameInput"
      type="text"
      maxlength="20"
      placeholder="Example: BigVic"
    >

    <button id="usernameButton">
      Continue
    </button>

  </div>


  <div id="status">
    Connecting...
  </div>


  <div id="messages"></div>


  <div class="send">

    <input
      id="messageInput"
      type="text"
      maxlength="500"
      placeholder="Write a message..."
    >

    <button id="sendButton">
      Send
    </button>

  </div>


  <button
    class="logout"
    id="logoutButton">
    Logout
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../config.js"></script>


<script>

const status =
  document.getElementById("status");

const messages =
  document.getElementById("messages");

const usernameBox =
  document.getElementById("usernameBox");

const usernameInput =
  document.getElementById("usernameInput");

const usernameButton =
  document.getElementById("usernameButton");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const logoutButton =
  document.getElementById("logoutButton");


let client = null;
let user = null;
let username = "";


/* Start */

async function start() {

  try {

    client =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );


    const result =
      await client.auth.getUser();


    if (!result.data.user) {

      window.location.href =
        "../auth.html";

      return;

    }


    user =
      result.data.user;


    username =
      localStorage.getItem(
        "bigvic_username"
      );


    if (username) {

      usernameBox.classList.add(
        "hidden"
      );

      status.textContent =
        "Welcome, " + username;

    } else {

      status.textContent =
        "Choose a name to enter the chat.";

    }


    await loadMessages();

  } catch (error) {

    status.textContent =
      "Error: " + error.message;

  }

}


/* Save username */

usernameButton.addEventListener(
  "click",
  function() {

    const name =
      usernameInput.value.trim();


    if (!name) {

      status.textContent =
        "Please enter a username.";

      return;

    }


    username = name;


    localStorage.setItem(
      "bigvic_username",
      username
    );


    usernameBox.classList.add(
      "hidden"
    );


    status.textContent =
      "Welcome, " + username;

  }
);


/* Load messages */

async function loadMessages() {

  const result =
    await client
      .from("messages")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (result.error) {

    status.textContent =
      "Chat error: " +
      result.error.message;

    return;

  }


  messages.innerHTML = "";


  if (result.data.length === 0) {

    messages.innerHTML = `

      <div class="message">

        <div class="sender">
          BigVic Fun
        </div>

        <div class="text">
          Welcome to BigVic Fun! 🎉
        </div>

      </div>

    `;

    return;

  }


  result.data.forEach(function(item) {

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "message";


    const sender =
      document.createElement(
        "div"
      );

    sender.className =
      "sender";


    /*
      Old messages contain the
      Supabase ID. New messages
      can show the chosen name.
    */

    if (item.sender === user.id) {

      sender.textContent =
        username || "BigVic";

    } else {

      sender.textContent =
        "BigVic User";

    }


    const text =
      document.createElement(
        "div"
      );

    text.className =
      "text";

    text.textContent =
      item.message;


    box.appendChild(sender);

    box.appendChild(text);

    messages.appendChild(box);

  });


  messages.scrollTop =
    messages.scrollHeight;

}


/* Send */

sendButton.addEventListener(
  "click",
  async function() {

    const text =
      messageInput.value.trim();


    if (!text) {
      return;
    }


    if (!username) {

      status.textContent =
        "Choose your username first.";

      return;

    }


    sendButton.disabled =
      true;


    const result =
      await client
        .from("messages")
        .insert({

          sender: user.id,

          receiver: user.id,

          message: text

        });


    if (result.error) {

      status.textContent =
        "Message error: " +
        result.error.message;

      sendButton.disabled =
        false;

      return;

    }


    messageInput.value = "";


    status.textContent =
      "Message sent.";


    await loadMessages();


    sendButton.disabled =
      false;

  }
);


/* Enter key */

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      sendButton.click();

    }

  }
);


/* Logout */

logoutButton.addEventListener(
  "click",
  async function() {

    await client.auth.signOut();

    localStorage.removeItem(
      "bigvic_username"
    );

    window.location.href =
      "../auth.html";

  }
);


start();

</script>

</body>
</html>
