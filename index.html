<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      color: #d1d5db;
    }

    .nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 5px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav a {
      text-decoration: none;
      color: #111827;
      font-weight: bold;
      font-size: 14px;
      padding: 8px 6px;
    }

    .nav a:hover {
      color: #2563eb;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin: 8px 0;
    }

    .card p {
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .nav a {
        font-size: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>BigVic Fun</h1>
    <p>Connect, chat, play and discover</p>
  </div>

  <div class="nav">

    <a href="index.html">
      🏠 Home
    </a>

    <a href="chat/">
      💬 Chat
    </a>

    <a href="games
