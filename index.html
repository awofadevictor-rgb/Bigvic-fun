<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px #00000015;
}

nav button {
  flex: 1;
  min-width: 70px;
  padding: 12px 8px;
  border: 0;
  border-radius: 8px;
  background: #e5e7eb;
  font-weight: bold;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {

}

button.action {

  margin-top: 10px;

  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button.green {
  background: #16a34a;
}

button.dark {
  background: #111827;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

textarea {
  min-height: 100px;
}

.result {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.post {
  background: white;
  padding: 15px;
  margin-top: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000012;
}

.post-name {
  font-weight: bold;
}

.post-text {
  margin-top: 10px;
  white-space: pre-wrap;
}
