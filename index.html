<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .top {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      border: 0;
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .profile {
      padding: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-weight: bold;
      font-size: 17px;
    }

    .profile-email {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .change-photo {
      display: inline-block;
      margin-top: 7px;
      background: #2563eb;
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    #photoInput {
      display: none;
    }

    #status {
      padding: 8px 15px;
      font-size: 13px;
      color: #666;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 350px;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
      gap: 9px;
      align-items: flex-start;
    }

    .message.mine {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #ddd;
    }

    .bubble-area {
      max-width: 75%;
    }

    .sender {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .mine .sender {
      text-align: right;
    }

    .bubble {
      background: #e5e7eb;
      padding: 10px 13px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
    }

    .time {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }

    .mine .time {
      text-align: right;
    }

    .send-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 15px;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      border: 0;
      background: #2563eb;
      color: white;
      border-radius: 22px;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    .error {
      color: #dc2626;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">BigVic Fun 💬</div>
    <button class="logout" id="logoutButton">Logout</button>
  </div>

  <div class="profile">

    <img
      id="profileAvatar"
      src="https://ui-avatars.com/api/?name=BigVic&background=random"
      alt="Profile"
    >

    <div class="profile-info">

      <div class="profile-name" id="profileName">
        BigVic
      </div>

      <div class="profile-email" id="profileEmail">
        Loading account...
      </div>

      <label class="change-photo" for="photoInput">
        Change photo
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

    </div>

  </div>

  <div id="status">
    Loading messages...
  </div>

  <div id="messages" class="messages"></div>

  <div class="send-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>

<script src="../config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.getElementById("status").innerHTML =
      "<span class='error'>BigVic setup error: config.js is missing.</span>";
    throw new Error("Supabase configuration missing.");
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  let user = null;

  let username =
    localStorage.getItem("bigvic_username") || "BigVic";

  let avatar =
    localStorage.getItem("bigvic_avatar") ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(username) +
    "&background=random";


  const messagesBox =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const statusBox =
    document.getElementById("status");

  const profileName =
    document.getElementById("profileName");

  const profileEmail =
    document.getElementById("profileEmail");

  const profileAvatar =
    document.getElementById("profileAvatar");


  profileName.textContent = username;

  profileAvatar.src = avatar;


  async function startApp() {

    try {

      const result =
        await client.auth.getUser();

      if (result.error || !result.data.user) {

        window.location.href = "../auth.html";

        return;
      }

      user = result.data.user;

      profileEmail.textContent =
        user.email || "";

      profileName.textContent =
        username;

      profileAvatar.src =
        avatar;

      await loadMessages();

    } catch (error) {

      console.error(error);

      statusBox.innerHTML =
        "<span class='error'>Unable to load BigVic chat.</span>";
    }
  }


  async function loadMessages() {

    statusBox.textContent =
      "Loading messages...";

    messagesBox.innerHTML = "";

    try {

      /*
       * IMPORTANT:
       * This makes only ONE database request.
       * It does not request profile information
       * for every message.
       */

      const result =
        await client
          .from("messages")
          .select("*")
          .order("created_at", {
            ascending: true
          });


      if (result.error) {

        console.error(result.error);

        statusBox.innerHTML =
          "<span class='error'>" +
          result.error.message +
          "</span>";

        return;
      }


      const messages =
        result.data || [];


      if (messages.length === 0) {

        messagesBox.innerHTML =
          "<div class='empty'>" +
          "No messages yet. Be the first to say hello! 👋" +
          "</div>";

      } else {

        for (const item of messages) {

          const isMine =
            item.sender === user.id;

          const senderName =
            isMine
              ? username
              : "BigVic User";

          const senderAvatar =
            isMine
              ? avatar
              : "https://ui-avatars.com/api/?name=BigVic+User&background=random";


          displayMessage(
            item,
            senderName,
            senderAvatar,
            isMine
          );
        }
      }


      statusBox.textContent =
        "BigVic Fun Chat";

      messagesBox.scrollTop =
        messagesBox.scrollHeight;

    } catch (error) {

      console.error(error);

      statusBox.innerHTML =
        "<span class='error'>Could not load messages.</span>";
    }
  }


  function displayMessage(
    item,
    senderName,
    senderAvatar,
    isMine
  ) {

    const messageDiv =
      document.createElement("div");

    messageDiv.className =
      "message" +
      (isMine ? " mine" : "");


    const avatarImg =
      document.createElement("img");

    avatarImg.className =
      "avatar";

    avatarImg.src =
      senderAvatar;

    avatarImg.onerror =
      function () {
        this.src =
          "https://ui-avatars.com/api/?name=BigVic&background=random";
      };


    const bubbleArea =
      document.createElement("div");

    bubbleArea.className =
      "bubble-area";


    const senderDiv =
      document.createElement("div");

    senderDiv.className =
      "sender";

    senderDiv.textContent =
      senderName;


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      item.message;


    const time =
      document.createElement("div");

    time.className =
      "time";

    if (item.created_at) {

      const date =
        new Date(item.created_at);

      time.textContent =
        date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
    }


    bubbleArea.appendChild(senderDiv);

    bubbleArea.appendChild(bubble);

    bubbleArea.appendChild(time);

    messageDiv.appendChild(avatarImg);

    messageDiv.appendChild(bubbleArea);

    messagesBox.appendChild(messageDiv);
  }


  async function sendMessage() {

    const text =
      messageInput.value.trim();

    if (!text) {
      return;
    }

    if (!user) {
      return;
    }


    sendButton.disabled = true;

    sendButton.textContent =
      "Sending...";


    try {

      const result =
        await client
          .from("messages")
          .insert({

            sender: user.id,

            receiver: "public",

            message: text

          });


      if (result.error) {

        alert(
          "Message could not be sent: " +
          result.error.message
        );

        console.error(result.error);

      } else {

        messageInput.value = "";

        await loadMessages();
      }

    } catch (error) {

      console.error(error);

      alert(
        "Something went wrong while sending the message."
      );

    } finally {

      sendButton.disabled = false;

      sendButton.textContent =
        "Send";
    }
  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
      }
    }
  );


  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function () {

        await client.auth.signOut();

        localStorage.removeItem(
          "bigvic_username"
        );

        localStorage.removeItem(
          "bigvic_avatar"
        );

        window.location.href =
          "../auth.html";
      }
    );


  document
    .getElementById("photoInput")
    .addEventListener(
      "change",
      function (event) {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          function (e) {

            avatar =
              e.target.result;

            localStorage.setItem(
              "bigvic_avatar",
              avatar
            );

            profileAvatar.src =
              avatar;
          };


        reader.readAsDataURL(file);
      }
    );


  startApp();

</script>

</body>
</html>
