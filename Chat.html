<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun Chat</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
  }

  .app {
    max-width: 600px;
    margin: auto;
    height: 100vh;
    background: white;
    display: flex;
    flex-direction: column;
  }

  .profile {
    padding: 15px;
    background: #f8fafc;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .profile img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
  }

  .profile-name {
    font-weight: bold;
  }

  .photo-button {
    display: inline-block;
    margin-top: 5px;
    background: #2563eb;
    color: white;
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .name-button {
    margin-top: 6px;
    margin-left: 6px;
    padding: 6px 9px;
    border: 0;
    border-radius: 6px;
    background: #111827;
    color: white;
    font-size: 12px;
  }

  .header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
  }

  .header h2 {
    margin: 0;
  }

  .nav {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    background: white;
    border-bottom: 1px solid #ddd;
  }

  .nav button {
    border: 0;
    background: none;
    font-weight: bold;
    font-size: 13px;
    padding: 6px;
  }

  .status {
    padding: 10px;
    text-align: center;
    font-size: 13px;
    color: #666;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
  }

  .message {
    margin-bottom: 12px;
  }

  .message.mine {
    text-align: right;
  }

  .name {
    font-size: 12px;
    color: #777;
    margin-bottom: 3px;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: middle;
    margin-right: 6px;
  }

  .bubble {
    display: inline-block;
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    background: #e5e7eb;
    word-break: break-word;
  }

  .mine .bubble {
    background: #2563eb;
    color: white;
  }

  .send-box {
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    gap: 8px;
  }

  #messageInput {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 25px;
    padding: 12px;
    font-size: 15px;
  }

  #sendButton {
    border: 0;
    border-radius: 25px;
    padding: 0 18px;
    background: #2563eb;
    color: white;
    font-weight: bold;
  }

  #logoutButton {
    margin-top: 8px;
    border: 0;
    background: #ef4444;
    color: white;
    padding: 7px 12px;
    border-radius: 7px;
  }
</style>
</head>

<body>

<div class="app">

  <!-- PROFILE -->

  <div class="profile">

    <img
      id="profileAvatar"
      src="https://ui-avatars.com/api/?name=BigVic"
    >

    <div>

      <div
        id="profileName"
        class="profile-name"
      >
        BigVic
      </div>

      <label
        for="photoInput"
        class="photo-button"
      >
        Change photo
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        style="display:none;"
      >

    </div>

  </div>


  <!-- HEADER -->

  <div class="header">

    <h2>BigVic Fun 💬</h2>

    <button id="logoutButton">
      Logout
    </button>

  </div>


  <!-- NAVIGATION -->

  <div class="nav">

    <button
      onclick="window.location.href='../index.html'"
    >
      🏠 Home
    </button>

    <button
      onclick="window.location.href='./'"
    >
      💬 Chat
    </button>

    <button
      onclick="alert('Games coming soon!')"
    >
      🎮 Games
    </button>

    <button
      onclick="alert('Trending coming soon!')"
    >
      🔥 Trending
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    Starting BigVic Chat...
  </div>


  <div id="messages"></div>


  <div class="send-box">

    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>


<script src="../config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const statusBox =
  document.getElementById("status");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const logoutButton =
  document.getElementById("logoutButton");

const profileAvatar =
  document.getElementById("profileAvatar");

const profileName =
  document.getElementById("profileName");

const photoInput =
  document.getElementById("photoInput");


let supabaseClient;

let currentUser;


let username =
  localStorage.getItem("bigvic_username") ||
  "BigVic";


profileName.textContent =
  username;


/*
  CHANGE NAME BUTTON
*/

const changeNameButton =
  document.createElement("button");

changeNameButton.textContent =
  "Change name";

changeNameButton.className =
  "name-button";


changeNameButton.onclick =
  function() {

    const newName =
      prompt(
        "Enter your BigVic name:",
        username
      );


    if (
      newName &&
      newName.trim()
    ) {

      username =
        newName.trim();

      localStorage.setItem(
        "bigvic_username",
        username
      );

      profileName.textContent =
        username;

    }

  };


profileName.parentElement
  .appendChild(
    changeNameButton
  );


/*
  SAVED PROFILE PHOTO
*/

const savedAvatar =
  localStorage.getItem(
    "bigvic_avatar"
  );


if (savedAvatar) {

  profileAvatar.src =
    savedAvatar;

}


/*
  START SUPABASE
*/

if (
  !window.SUPABASE_URL ||
  !window.SUPABASE_ANON_KEY
) {

  statusBox.textContent =
    "BigVic setup error.";

} else {

  supabaseClient =
    window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

  startChat();

}


/*
  GET USER
*/

async function startChat() {

  try {

    statusBox.textContent =
      "Checking login...";


    const result =
      await supabaseClient.auth.getUser();


    if (result.error) {

      console.log(
        result.error
      );

      statusBox.textContent =
        "Login check failed.";

      return;

    }


    currentUser =
      result.data.user;


    if (!currentUser) {

      window.location.href =
        "../auth
