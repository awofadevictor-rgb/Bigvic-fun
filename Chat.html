<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10102b;
      color: white;
    }

    .header {
      background: #1d1d45;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333366;
    }

    .header h1 {
      margin: 0;
      color: #00d9ff;
    }

    .header p {
      margin: 8px 0 0;
      color: #bbbbcc;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: #1d1d45;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: #ffcc33;
    }

    .chat-box {
      background: #18183a;
      border-radius: 15px;
      padding: 15px;
    }

    #messages {
      height: 350px;
      overflow-y: auto;
      padding: 10px;
      background: #10102b;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .message {
      background: #292955;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message-user {
      color: #00d9ff;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .message-text {
      color: white;
      word-break: break-word;
    }

    .send-area {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #555577;
      border-radius: 8px;
      background: #292955;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #sendButton {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: #ffcc33;
      color: #111122;
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      color: #bbbbcc;
    }

    #logoutButton {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #333355;
      color: white;
    }

    .error {
      color: #ff7777 !important;
    }

    .success {
      color: #66ff99 !important;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>BigVic Fun 💬</h1>
  <p>Chat • Games • Trending • Fun</p>
</div>

<div class="container">

  <div class="welcome">
    <h2>Welcome to BigVic Fun</h2>
    <p id="userInfo">Checking your account...</p>
  </div>

  <div class="chat-box">

    <div id="status">
      Connecting to chat...
    </div>

    <div id="messages">
      <div class="message">
        <div class="message-user">
          BigVic Fun
        </div>

        <div class="message-text">
          Welcome to the BigVic Fun chat! 🎉
        </div>
      </div>
    </div>

    <div class="send-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Write a message..."
        maxlength="500"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <button id="logoutButton">
    Logout
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script>

const status = document.getElementById("status");
const userInfo = document.getElementById("userInfo");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const logoutButton = document.getElementById("logoutButton");

let supabaseClient = null;
let currentUser = null;


function showStatus(text, type = "") {

  status.textContent = text;

  status.className = type;
}


async function startApp() {

  try {

    if (!window.SUPABASE_URL) {
      showStatus("Supabase URL is missing.", "error");
      return;
    }

    if (!window.SUPABASE_ANON_KEY) {
      showStatus("Supabase publishable key is missing.", "error");
      return;
    }

    if (!window.supabase) {
      showStatus("Supabase library did not load.", "error");
      return;
    }


    supabaseClient = window
