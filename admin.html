<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #2563eb);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 18px;
    padding: 30px 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.secondary:hover {
    background: #d1d5db;
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    text-align: center;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

.small {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">BigVic Fun</div>
    <div class="subtitle">Connect, chat and have fun</div>

    <!-- LOGIN -->
    <div id="loginForm" class="form active">

        <h2>Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email address"
            autocomplete="email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="loginMessage" class="message"></div>

        <div class="links">
            <a onclick="showSignup()">Create account</a>
            <br><br>
            <a onclick="showReset()">Forgot password?</a>
        </div>

    </div>


    <!-- SIGNUP -->
    <div id="signupForm" class="form">

        <h2>Create Account</h2>

        <input
            type="text"
            id="signupUsername"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email address"
            autocomplete="email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button onclick="signup()">
            Create Account
        </button>

        <div id="signupMessage" class="message"></div>

        <div class="links">
            <a onclick="showLogin()">Already have an account? Login</a>
        </div>

    </div>


    <!-- PASSWORD RESET -->
    <div id="resetForm" class="form">

        <h2>Reset Password</h2>

        <input
            type="email"
            id="resetEmail"
            placeholder="Email address"
            autocomplete="email"
        >

        <button onclick="resetPassword()">
            Send Reset Email
        </button>

        <div id="resetMessage" class="message"></div>

        <div class="links">
            <a onclick="showLogin()">Back to Login</a>
        </div>

    </div>

    <div class="small">
        © 2026 BigVic Fun
    </div>

</div>

<script>

const supabase = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
);


// -----------------------------
// SHOW LOGIN
// -----------------------------

function showLogin() {

    document.getElementById("loginForm").classList.add("active");
    document.getElementById("signupForm").classList.remove("active");
    document.getElementById("resetForm").classList.remove("active");

}


// -----------------------------
// SHOW SIGNUP
// -----------------------------

function showSignup() {

    document.getElementById("loginForm").classList.remove("active");
    document.getElementById("signupForm").classList.add("active");
    document.getElementById("resetForm").classList.remove("active");

}


// -----------------------------
// SHOW RESET
// -----------------------------

function showReset() {

    document.getElementById("loginForm").classList.remove("active");
    document.getElementById("signupForm").classList.remove("active");
    document.getElementById("resetForm").classList.add("active");

}


// -----------------------------
// MESSAGE
// -----------------------------

function showMessage(id, text, type) {

    const box = document.getElementById(id);

    box.textContent = text;
    box.className = "message " + type;
    box.style.display = "block";

}


// -----------------------------
// LOGIN
// -----------------------------

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {

        showMessage(
            "loginMessage",
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    showMessage(
        "loginMessage",
        "Logging in...",
        "success"
    );


    const { data, error } =
        await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        showMessage(
            "loginMessage",
            error.message,
            "error"
        );

        return;
    }


    if (!data.user) {

        showMessage(
            "loginMessage",
            "Login failed.",
            "error"
        );

        return;
    }


    // --------------------------------
    // CHECK SUSPENSION STATUS
    // --------------------------------

    const { data: profile, error: profileError } =
        await supabase
            .from("profiles")
            .select("is_suspended")
            .eq("id", data.user.id)
            .maybeSingle();


    if (profileError) {

        console.error(profileError);

        await supabase.auth.signOut();

        showMessage(
            "loginMessage",
            "Unable to verify your account status. Please try again.",
            "error"
        );

        return;
    }


    // --------------------------------
    // SUSPENDED ACCOUNT
    // --------------------------------

    if (profile && profile.is_suspended === true) {

        await supabase.auth.signOut();

        showMessage(
            "loginMessage",
            "Your BigVic Fun account has been suspended by an administrator.",
            "error"
        );

        return;
    }


    // --------------------------------
    // LOGIN SUCCESS
    // --------------------------------

    showMessage(
        "loginMessage",
        "Login successful. Opening BigVic Fun...",
        "success"
    );


    setTimeout(() => {

        window.location.href = "/";

    }, 700);

}


// -----------------------------
// SIGN UP
// -----------------------------

async function signup() {

    const username =
        document.getElementById("signupUsername").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;


    if (!username || !email || !password) {

        showMessage(
            "signupMessage",
            "Please fill in all fields.",
            "error"
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "signupMessage",
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    showMessage(
        "signupMessage",
        "Creating your account...",
        "success"
    );


    const { data, error } =
        await supabase.auth.signUp({
            email: email,
            password: password
        });


    if (error) {

        showMessage(
            "signupMessage",
            error.message,
            "error"
        );

        return;
    }


    if (!data.user) {

        showMessage(
            "signupMessage",
            "Account creation failed.",
            "error"
        );

        return;
    }


    // Create profile
    const { error: profileError } =
        await supabase
            .from("profiles")
            .upsert({
                id: data.user.id,
                username: username,
                email: email,
                is_suspended: false
            });


    if (profileError) {

        console.error(profileError);

        showMessage(
            "signupMessage",
            "Account created, but profile setup failed.",
            "error"
        );

        return;
    }


    showMessage(
        "signupMessage",
        "Account created successfully!",
        "success"
    );


    setTimeout(() => {

        window.location.href = "/";

    }, 1000);

}


// -----------------------------
// PASSWORD RESET
// -----------------------------

async function resetPassword() {

    const email =
        document.getElementById("resetEmail").value.trim();


    if (!email) {

        showMessage(
            "resetMessage",
            "Please enter your email address.",
            "error"
        );

        return;
    }


    const { error } =
        await supabase.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin + "/auth.html"
            }
        );


    if (error) {

        showMessage(
            "resetMessage",
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "resetMessage",
        "Password reset email sent. Check your inbox.",
        "success"
    );

}

</script>

</body>
</html>
