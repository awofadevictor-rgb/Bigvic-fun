<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.logout {
    background: #ef4444;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.status {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.status h2 {
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #64748b;
}

.number {
    font-size: 30px;
    font-weight: bold;
}

.section {
    background: white;
    margin-bottom: 20px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section h2 {
    margin-top: 0;
}

.user {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 10px;
}

.user strong {
    display: block;
    margin-bottom: 5px;
}

.small {
    color: #64748b;
    font-size: 13px;
}

.home {
    background: #2563eb;
    color: white;
    margin-right: 8px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>BigVic Fun Admin Dashboard</h1>

    <div>
        <button class="home" onclick="goHome()">Home</button>
        <button class="home" onclick="goChat()">Chat</button>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div id="checking" class="status">
        <h2>Checking administrator access...</h2>
        <p>Please wait.</p>
    </div>

    <div id="denied" class="status error hidden">
        <h2>Access denied</h2>
        <p>This account is not the administrator account.</p>
    </div>

    <div id="dashboard" class="hidden">

        <div class="status success">
            <h2>Administrator access granted</h2>
            <p id="adminAccount"></p>
        </div>

        <div class="stats">

            <div class="card">
                <h3>Total Users</h3>
                <div id="userCount" class="number">0</div>
            </div>

            <div class="card">
                <h3>Total Posts</h3>
                <div id="postCount" class="number">0</div>
            </div>

            <div class="card">
                <h3>Reports</h3>
                <div id="reportCount" class="number">0</div>
            </div>

        </div>

        <div class="section">
            <h2>User Management</h2>
            <div id="users">
                Loading users...
            </div>
        </div>

        <div class="section">
            <h2>Reports</h2>
            <div id="reports">
                Loading reports...
            </div>
        </div>

    </div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
);

async function checkAdmin() {

    try {

        document.getElementById("checking").classList.remove("hidden");
        document.getElementById("denied").classList.add("hidden");
        document.getElementById("dashboard").classList.add("hidden");

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            throw error
