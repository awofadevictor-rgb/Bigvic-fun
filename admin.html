<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #18212f;
}

header {
  background: linear-gradient(135deg, #111827, #2563eb);
  color: white;
  padding: 22px 18px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.stat {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.stat-number {
  font-size: 30px;
  font-weight: bold;
  color: #2563eb;
}

.stat-label {
  margin-top: 5px;
  color: #64748b;
}

  border-radius: 10px;
  padding: 11px 15px;

  font
