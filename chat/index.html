<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    h2 {
      margin: 0;
    }

    #status {
      padding: 20px;
      font-weight: bold;
    }

    #messages {
      padding: 20px;
    }

    .message {
      background: #e5e7eb;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    #message {
      width: 70%;
      padding: 12px;
    }

    #send {
      padding: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h2>BigVic Fun 💬</h2>
  </header>

  <div id="status">
    Connecting to BigVic...
  </div>

  <div id="messages"></div>

  <div style="padding:20px;">
    <input id="message" placeholder="Write a message">
    <button id="send">Send</button>
  </div>

</div>


<script src="../config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

console.log("STEP 1: Page loaded");

const status = document.getElementById("status");


if (!window.SUPABASE_URL) {

  status.textContent =
    "ERROR: SUPABASE_URL is missing";

} else if (!window.SUPABASE_ANON_KEY) {

  status.textContent =
    "ERROR: SUPABASE_ANON_KEY is missing";

} else {

  status.textContent =
    "STEP 2: Supabase settings found";

}


if (
  window.SUPABASE_URL &&
  window.SUPABASE_ANON_KEY
) {

  const client =
    window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );


  async function testConnection() {

    status.textContent =
      "STEP 3: Checking login...";


    const userResult =
      await client.auth.getUser();


    if (userResult.error) {

      status.textContent =
        "LOGIN ERROR: " +
        userResult.error.message;

      return;

    }


    if (!userResult.data.user) {

      status.textContent =
        "No logged-in user. Redirecting...";

      window.location.href =
        "../auth.html";

      return;

    }


    status.textContent =
      "STEP 4: Login OK. Checking messages...";


    const messageResult =
      await client
        .from("messages")
        .select("*")
        .limit(20);


    if (messageResult.error) {

      status.textContent =
        "DATABASE ERROR: " +
        messageResult.error.message;

      console.error(
        messageResult.error
      );

      return;

    }


    status.textContent =
      "SUCCESS: Messages database is working!";


    const messages =
      document.getElementById("messages");


    if (
      !messageResult.data ||
      messageResult.data.length === 0
    ) {

      messages.innerHTML =
        "<p>No messages yet.</p>";

      return;

    }


    messageResult.data.forEach(function(item) {

      const div =
        document.createElement("div");

      div.className =
        "message";

      div.textContent =
        item.message;

      messages.appendChild(div);

    });

  }


  testConnection();

}

</script>

</body>
</html>
