
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun Chat</title>

<!-- New BigVic Fun browser icon -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2319233b'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23ffca28' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
  display: flex;
  flex-direction: column;
}

.top-nav {
  display: flex;
  justify-content: space-around;
  gap: 5px;
  padding: 12px 5px;
  background: white;
  border-bottom: 1px solid #ddd;
  overflow-x: auto;
}

.top-nav button {
  border: 0;
  background: none;
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
  padding: 8px;
  cursor: pointer;
}

.profile {
  padding: 15px;
  background: #f8fafc;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 12px;
}

.profile img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.profile-name {
  font-weight: bold;
}

.photo-button {
  display: inline-block;
  margin-top: 5px;
  background: #2563eb;
  color: white;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

.header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

.header h2 {
  margin: 0;
}

.status {
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: #666;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  min-height: 250px;
}

.message {
  margin-bottom: 12px;
}

.message.mine {
  text-align: right;
}

.name {
  font-size: 12px;
  color: #777;
  margin-bottom: 3px;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  vertical-align: middle;
  margin-right: 6px;
}

.bubble {
  display: inline-block;
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 16px;
  background: #e5e7eb;
  word-break: break-word;
}

.mine .bubble {
  background: #2563eb;
  color: white;
}

.send-box {
  display: flex;
  padding: 12px;
  border-top: 1px solid #ddd;
  gap: 8px;
  position: sticky;
  bottom: 0;
  background: white;
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 25px;
  padding: 12px;
  font-size: 15px;
}

#sendButton {
  border: 0;
  border-radius: 25px;
  padding: 0 18px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

#logoutButton {
  margin-top: 8px;
  border: 0;
  background: #ef4444;
  color: white;
  padding: 9px 14px;
  border-radius: 7px;
}

#logoutButton:disabled,
#sendButton:disabled {
  opacity: 0.6;
}

</style>
</head>

<body>

<!-- Navigation -->
<div class="top-nav">

  <button onclick="goHome()">
    🏠 Home
  </button>

  <button onclick="goChat()">
    💬 Chat
  </button>

  <button onclick="goGames()">
    🎮 Games
  </button>

  <button onclick="goTrending()">
    🔥 Trending
  </button>

  <button onclick="goScores()">
    🏆 Scores
  </button>

</div>

<div class="app">

  <!-- Profile -->
  <div class="profile">

    <img
      id="profileAvatar"
      src="https://ui-avatars.com/api/?name=BigVic"
      alt="Profile photo"
    >

    <div>

      <div id="profileName" class="profile-name">
        BigVic
      </div>

      <label for="photoInput" class="photo-button">
        Change photo
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        style="display:none;"
      >

    </div>

  </div>

  <!-- Chat heading -->
  <div class="header">

    <h2>BigVic Fun 💬</h2>

    <button id="logoutButton">
      Logout
    </button>

  </div>

  <div id="status" class="status">
    Starting BigVic Chat...
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Message input -->
  <div class="send-box">

    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const statusBox =
  document.getElementById("status");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const logoutButton =
  document.getElementById("logoutButton");

const profileAvatar =
  document.getElementById("profileAvatar");

const profileName =
  document.getElementById("profileName");

const photoInput =
  document.getElementById("photoInput");

let supabaseClient;
let currentUser;

let username =
  localStorage.getItem("bigvic_username") ||
  "BigVic";

/* Navigation fixes */

function goHome() {
  window.location.href = "/";
}

function goChat() {
  window.location.href = "/chat/";
}

function goGames() {
  window.location.href = "/?page=games";
}

function goTrending() {
  window.location.href = "/?page=trending";
}

function goScores() {
  window.location.href = "/?page=scores";
}

/* Change name button */

const changeNameButton =
  document.createElement("button");

changeNameButton.textContent =
  "Change name";

changeNameButton.style.marginTop = "6px";
changeNameButton.style.marginLeft = "6px";
changeNameButton.style.padding = "6px 9px";
changeNameButton.style.border = "0";
changeNameButton.style.borderRadius = "6px";
changeNameButton.style.background = "#111827";
changeNameButton.style.color = "white";
changeNameButton.style.fontSize = "12px";

changeNameButton.onclick = function() {

  const newName = prompt(
    "Enter your BigVic name:",
    username
  );

  if (newName && newName.trim()) {

    username = newName.trim();

    localStorage.setItem(
      "bigvic_username",
      username
    );

    profileName.textContent = username;

  }

};

profileName.parentElement.appendChild(
  changeNameButton
);

profileName.textContent = username;

/* Load saved profile photo */

const savedAvatar =
  localStorage.getItem("bigvic_avatar");

if (savedAvatar) {
  profileAvatar.src = savedAvatar;
}

/* Start Supabase */

if (
  !window.SUPABASE_URL ||
  !window.SUPABASE_ANON_KEY ||
  !window.supabase
) {

  statusBox.textContent =
    "BigVic setup error. Check your configuration.";

} else {

  supabaseClient =
    window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

  startChat();

}

/* Check logged-in user */

async function startChat() {

  try {

    statusBox.textContent =
      "Checking login...";

    const result =
      await supabaseClient.auth.getUser();

    if (result.error) {
      throw result.error;
    }

    currentUser = result.data.user;

    if (!currentUser) {

      window.location.href = "/auth.html";
      return;

    }

    statusBox.textContent =
      "Connected to BigVic Chat";

    await loadMessages();

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Connection error. Please refresh.";

  }

}

/* Load messages */

async function loadMessages() {

  statusBox.textContent =
    "Loading messages...";

  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });

  if (result.error) {

    console.error(result.error);

    statusBox.textContent =
      "Messages error: " + result.error.message;

    return;

  }

  messagesBox.innerHTML = "";

  if (!result.data || result.data.length === 0) {

    messagesBox.innerHTML =
      "<p style='text-align:center;color:#888'>" +
      "No messages yet. Say hello! 👋</p>";

  } else {

    result.data.forEach(function(item) {
      showMessage(item);
    });

  }

  statusBox.textContent =
    "BigVic Fun Chat";

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}

/* Display message */

function showMessage(item) {

  const mine =
    item.sender === currentUser.id;

  const wrapper =
    document.createElement("div");

  wrapper.className =
    mine ? "message mine" : "message";

  const name =
    document.createElement("div");

  name.className = "name";

  name.textContent =
    mine ? username : "BigVic User";

  const avatar =
    document.createElement("img");

  avatar.className = "avatar";

  avatar.src = mine
    ? (localStorage.getItem("bigvic_avatar") ||
       "https://ui-avatars.com/api/?name=BigVic")
    : "https://ui-avatars.com/api/?name=BigVic";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";
  bubble.textContent = item.message;

  wrapper.appendChild(name);
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  messagesBox.appendChild(wrapper);

}

/* Send message */

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) return;

  if (!currentUser) {

    alert("You are not logged in.");
    return;

  }

  sendButton.disabled = true;
  sendButton.textContent = "Sending...";

  try {

    const result =
      await supabaseClient
        .from("messages")
        .insert({

          sender: currentUser.id,
          receiver: "public",
          message: text

        });

    if (result.error) {
      throw result.error;
    }

    messageInput.value = "";

    await loadMessages();

  } catch (error) {

    console.error(error);

    alert("Message failed: " + error.message);

  }

  sendButton.disabled = false;
  sendButton.textContent = "Send";

}

/* Send button */

sendButton.addEventListener(
  "click",
  sendMessage
);

/* Enter key */

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();
      sendMessage();

    }

  }
);

/* Change profile photo */

photoInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please choose an image.");
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      alert("Please choose an image smaller than 2 MB.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      localStorage.setItem(
        "bigvic_avatar",
        e.target.result
      );

      profileAvatar.src =
        e.target.result;

    };

    reader.readAsDataURL(file);

  }
);

/* Logout */

logoutButton.addEventListener(
  "click",
  async function() {

    logoutButton.disabled = true;

    try {

      await supabaseClient.auth.signOut();

      window.location.href = "/auth.html";

    } catch (error) {

      console.error(error);

      alert("Could not log out. Please try again.");

      logoutButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
