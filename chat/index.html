<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d25;
      color: white;
    }

    header {
      background: #1f1f50;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 1px solid #353568;
    }

    header h1 {
      margin: 0;
      color: #00d9ff;
      font-size: 27px;
    }

    .online {
      margin-top: 6px;
      color: #54e88b;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .profile {
      background: #1b1b42;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      text-align: center;
    }

    .avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00d9ff;
      background: #292952;
    }

    .profile-name {
      margin: 10px 0 5px;
      font-size: 20px;
      font-weight: bold;
    }

    .profile-status {
      color: #54e88b;
      font-size: 13px;
    }

    .profile input {
      display: none;
    }

    .photo-button {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      border-radius: 9px;
      background: #00d9ff;
      color: #061018;
      font-weight: bold;
      font-size: 14px;
    }

    .name-box {
      background: #1b1b42;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .name-box h2 {
      margin-top: 0;
      font-size: 19px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #44447a;
      border-radius: 10px;
      background: #292952;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      background: #00d9ff;
      color: #061018;
      font-size: 15px;
      font-weight: bold;
    }

    #saveNameBtn {
      width: 100%;
      margin-top: 10px;
    }

    #status {
      text-align: center;
      color: #54e88b;
      margin: 10px 0;
      font-size: 14px;
    }

    #messages {
      height: 55vh;
      min-height: 380px;
      overflow-y: auto;
      padding: 15px;
      background: #151535;
      border-radius: 15px;
      border: 1px solid #292953;
    }

    .message {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      align-items: flex-end;
    }

    .message.me {
      justify-content: flex-end;
    }

    .message.me .avatar-small {
      order: 2;
    }

    .avatar-small {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #292952;
      border: 1px solid #55558a;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 15px;
      background: #292953;
    }

    .message.me .bubble {
      background: #07536a;
      border-bottom-right-radius: 4px;
    }

    .message:not(.me) .bubble {
      border-bottom-left-radius: 4px;
    }

    .username {
      color: #00d9ff;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .message-text {
      font-size: 16px;
      line-height: 1.4;
      word-break: break-word;
    }

    .time {
      margin-top: 5px;
      color: #aaa;
      font-size: 10px;
    }

    .send-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #messageInput {
      flex: 1;
    }

    #sendBtn {
      width: 90px;
      background: #ffd21c;
      color: #111;
    }

    .logout {
      width: 100%;
      margin-top: 12px;
      background: #353555;
      color: white;
    }

    .welcome {
      text-align: center;
      color: #bbb;
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>BigVic Fun 💬</h1>
  <div class="online">● Chat is online</div>
</header>

<div class="container">

  <!-- PROFILE -->
  <div id="profileBox" class="profile hidden">

    <img
      id="profileAvatar"
      class="avatar"
      src=""
      alt="Profile picture"
    >

    <div id="profileName"
         class="profile-name">
    </div>

    <div class="profile-status">
      ● Online
    </div>

    <label
      for="photoInput"
      class="photo-button">
      Change Profile Picture
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- CHOOSE NAME -->
  <div id="nameBox"
       class="name-box">

    <h2>Choose your chat name</h2>

    <input
      id="usernameInput"
      type="text"
      maxlength="20"
      placeholder="Example: BigVic"
    >

    <button id="saveNameBtn">
      Continue
    </button>

  </div>


  <div id="status"></div>

  <div id="welcome"
       class="welcome">
  </div>


  <!-- MESSAGES -->
  <div id="messages">

    <div class="empty">
      Loading messages...
    </div>

  </div>


  <!-- SEND -->
  <div class="send-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button id="sendBtn">
      Send
    </button>

  </div>


  <button
    id="logoutBtn"
    class="logout">
    Logout
  </button>

</div>

    window.SUPABASE_URL;

    window
