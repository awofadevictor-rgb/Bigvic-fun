<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .app {
      max-width: 600px;
      margin: auto;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h2 {
      margin: 0;
    }

    .status {
      padding: 10px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 12px;
    }

    .message.mine {
      text-align: right;
    }

    .name {
      font-size: 12px;
      color: #777;
      margin-bottom: 3px;
    }

    .bubble {
      display: inline-block;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      background: #e5e7eb;
      word-break: break-word;
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
    }

    .send-box {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 12px;
      font-size: 15px;
    }

    #sendButton {
      border: 0;
      border-radius: 25px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    #logoutButton {
      margin-top: 8px;
      border: 0;
      background: #ef4444;
      color: white;
      padding: 7px 12px;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<div class="app">
<div style="padding:15px; background:#f8fafc; border-bottom:1px solid #ddd; display:flex; align-items:center; gap:12px;">

  <img
    id="profileAvatar"
    src="https://ui-avatars.com/api/?name=BigVic&background=random"
    style="width:50px;height:50px;border-radius:50%;object-fit:cover;"
  >

  <div>
    <div id="profileName" style="font-weight:bold;">
      BigVic
    </div>

    <label
      for="photoInput"
      style="display:inline-block;margin-top:5px;background:#2563eb;color:white;padding:6px 9px;border-radius:6px;font-size:12px;cursor:pointer;"
    >
      Change photo
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      style="display:none;"
    >
  </div>

</div>
  <div class="header">
    <h2>BigVic Fun 💬</h2>
    <button id="logoutButton">Logout</button>
  </div>

  <div id="status" class="status">
    Starting BigVic Chat...
  </div>

  <div id="messages"></div>

  <div class="send-box">

    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>


<script src="../config.js"></script>
<script>
const savedAvatar =
  localStorage.getItem("bigvic_avatar");

const savedUsername =
  localStorage.getItem("bigvic_username") ||
  "BigVic";

if (savedAvatar) {
  document.getElementById("profileAvatar").src =
    savedAvatar;
}

document.getElementById("profileName").textContent =
  savedUsername;

document.getElementById("photoInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      localStorage.setItem(
        "bigvic_avatar",
        e.target.result
      );

      document.getElementById("profileAvatar").src =
        e.target.result;
    };

    reader.readAsDataURL(file);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const statusBox =
  document.getElementById("status");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const logoutButton =
  document.getElementById("logoutButton");


let supabaseClient;

let currentUser;


let username =
  localStorage.getItem("bigvic_username") ||
  "BigVic";


/*
  Start Supabase
*/

if (
  !window.SUPABASE_URL ||
  !window.SUPABASE_ANON_KEY
) {

  statusBox.textContent =
    "BigVic setup error.";

} else {

  supabaseClient =
    window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

  startChat();
}


/*
  Get logged-in user
*/

async function startChat() {

  try {

    statusBox.textContent =
      "Checking login...";

    const result =
      await supabaseClient.auth.getUser();


    if (result.error) {

      console.log(result.error);

      statusBox.textContent =
        "Login check failed.";

      return;
    }


    currentUser =
      result.data.user;


    if (!currentUser) {

      window.location.href =
        "../auth.html";

      return;
    }


    statusBox.textContent =
      "Connected to BigVic Chat";


    await loadMessages();

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Connection error.";

  }
}


/*
  Load messages
*/

async function loadMessages() {

  statusBox.textContent =
    "Loading messages...";


  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });


  if (result.error) {

    console.error(result.error);

    statusBox.textContent =
      "Messages error: " +
      result.error.message;

    return;
  }


  messagesBox.innerHTML =
    "";


  if (
    !result.data ||
    result.data.length === 0
  ) {

    messagesBox.innerHTML =
      "<p style='text-align:center;color:#888'>" +
      "No messages yet. Say hello! 👋" +
      "</p>";

  } else {

    result.data.forEach(function(item) {

      showMessage(item);

    });

  }


  statusBox.textContent =
    "BigVic Fun Chat";

  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}


/*
  Display one message
*/

function showMessage(item) {

  const mine =
    item.sender === currentUser.id;


  const wrapper =
    document.createElement("div");

  wrapper.className =
    mine
      ? "message mine"
      : "message";


  const name =
    document.createElement("div");

  name.className =
    "name";

  name.textContent =
    mine
      ? username
      : "BigVic User";

const avatar =
  document.createElement("img");

avatar.src =
  item.sender === currentUser.id
    ? (localStorage.getItem("bigvic_avatar") ||
       "https://ui-avatars.com/api/?name=BigVic")
    : "https://ui-avatars.com/api/?name=BigVic";

avatar.style.width = "30px";
avatar.style.height = "30px";
avatar.style.borderRadius = "50%";
avatar.style.objectFit = "cover";
avatar.style.verticalAlign = "middle";
avatar.style.marginRight = "6px";
  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    item.message;


  wrapper.appendChild(name);
wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  messagesBox.appendChild(wrapper);
}


/*
  Send message
*/

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text) {

    return;
  }


  if (!currentUser) {

    alert("You are not logged in.");

    return;
  }


  sendButton.disabled =
    true;

  sendButton.textContent =
    "Sending...";


  const result =
    await supabaseClient
      .from("messages")
      .insert({
        sender: currentUser.id,
        receiver: "public",
        message: text
      });


  if (result.error) {

    console.error(result.error);

    alert(
      "Message failed: " +
      result.error.message
    );

  } else {

    messageInput.value =
      "";

    await loadMessages();

  }


  sendButton.disabled =
    false;

  sendButton.textContent =
    "Send";
}


/*
  Send button
*/

sendButton.addEventListener(
  "click",
  sendMessage
);


/*
  Enter key
*/

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
  Logout
*/

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    localStorage.removeItem(
      "bigvic_username"
    );

    window.location.href =
      "../auth.html";

  }
);

</script>

</body>
</html>
