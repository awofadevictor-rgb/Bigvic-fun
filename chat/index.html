<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    #logout {
      background: #ef4444;
      color: white;
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .user {
      padding: 12px 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
    }

    .user strong {
      color: #2563eb;
    }

    #status {
      padding: 10px 15px;
      color: #666;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      min-height: 400px;
      padding: 15px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .msg.mine {
      align-items: flex-end;
    }

    .name {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .bubble {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 15px;
      background: #e5e7eb;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
    }

    .time {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
    }

    .send {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    #message {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
    }

    #send {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 22px;
      padding: 0 18px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }

    .error {
      color: red;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h2>BigVic Fun 💬</h2>
    <button id="logout">Logout</button>
  </header>

  <div class="user">
    Logged in as:
    <strong id="username">BigVic</strong>
  </div>

  <div id="status">
    Loading messages...
  </div>

  <div id="messages"></div>

  <div class="send">

    <input
      id="message"
      type="text"
      placeholder="Write a message..."
    >

    <button id="send">
      Send
    </button>

  </div>

</div>

<script src="../config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const supabaseUrl =
    window.SUPABASE_URL;

  const supabaseKey =
    window.SUPABASE_ANON_KEY;


  if (!supabaseUrl || !supabaseKey) {

    document.getElementById("status").innerHTML =
      "<div class='error'>Supabase configuration is missing.</div>";

  } else {

    const client =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    let currentUser = null;


    let username =
      localStorage.getItem("bigvic_username");


    if (!username) {

      username = "BigVic";

    }


    document.getElementById("username").textContent =
      username;


    async function start() {

      try {

        const result =
          await client.auth.getUser();
