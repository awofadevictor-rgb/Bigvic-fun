<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
  display: flex;
  flex-direction: column;
}

header {
  background: #111827;
  color: white;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  font-size: 21px;
}

#logout {
  background: #ef4444;
  border: 0;
  color: white;
  padding: 8px 12px;
  border-radius: 7px;
}

#status {
  padding: 10px 15px;
  font-size: 13px;
  color: #666;
}

#messages {
  flex: 1;
  min-height: 400px;
  padding: 15px;
  overflow-y: auto;
}

.message {
  margin-bottom: 14px;
}

.message.mine {
  text-align: right;
}

.name {
  font-size: 12px;
  color: #777;
  margin-bottom: 4px;
}

.bubble {
  display: inline-block;
  max-width: 80%;
  background: #e5e7eb;
  padding: 10px 13px;
  border-radius: 15px;
  text-align: left;
  word-break: break-word;
}

.message.mine .bubble {
  background: #2563eb;
  color: white;
}

.time {
  font-size: 10px;
  color: #999;
  margin-top: 3px;
}

.send-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #ddd;
}

#messageInput {
  flex: 1;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 22px;
  font-size: 15px;
  outline: none;
}

#sendButton {
  background: #2563eb;
  border: 0;
  color: white;
  border-radius: 22px;
  padding: 0 18px;
  font-weight: bold;
}

.error {
  color: #dc2626;
  padding: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h2>BigVic Fun 💬</h2>
  <button id="logout">Logout</button>
</header>

<div id="status">
  Connecting...
</div>

<div id="messages"></div>

<div class="send-area">

  <input
    id="messageInput"
    type="text"
    placeholder="Write a message..."
  >

  <button id="sendButton">
    Send
  </button>

</div>

</div>


<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  window.supabase.createClient(

    window.SUPABASE_ANON_KEY
  );
