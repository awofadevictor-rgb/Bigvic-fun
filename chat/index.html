
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun Chat</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2319233b'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23ffca28' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101322;color:white}
.app{max-width:600px;margin:auto;min-height:100vh;background:#101322;display:flex;flex-direction:column}
.top-nav{display:flex;justify-content:space-around;gap:5px;padding:12px 5px;background:#19233b;border-bottom:1px solid #303957;overflow-x:auto}
.top-nav button{border:0;background:transparent;color:#ffca28;font-weight:bold;font-size:15px;white-space:nowrap;padding:8px;cursor:pointer}
.profile{padding:15px;background:#19233b;border-bottom:1px solid #303957;display:flex;align-items:center;gap:12px}
.profile img{width:65px;height:65px;border-radius:50%;object-fit:cover}
.profile-name{font-weight:bold;color:#ffca28}
.photo-button{display:inline-block;margin-top:5px;background:#ffca28;color:#101322;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:bold}
.header{background:#19233b;color:#ffca28;padding:15px;text-align:center;border-bottom:1px solid #303957}
.header h2{margin:0 0 8px}
#logoutButton{border:0;background:#ffca28;color:#101322;padding:9px 14px;border-radius:7px;font-weight:bold}
.status{padding:10px;text-align:center;font-size:13px;color:#c0c8dc}
.chat-switch{display:flex;gap:8px;padding:10px;background:#19233b}
.chat-switch button{flex:1;padding:12px 5px;border:1px solid #46506d;border-radius:9px;background:#101322;color:#ffca28;font-weight:bold}
.chat-switch button.active{background:#ffca28;color:#101322;border-color:#ffca28}
#contactsPanel,#groupsPanel{padding:12px;background:#19233b;border-bottom:1px solid #303957}
.panel-title{color:#ffca28;font-weight:bold;margin-bottom:10px}
#contactsList,#groupsList{display:flex;gap:9px;overflow-x:auto;padding:8px 0}
.contact,.group-item{min-width:90px;max-width:120px;padding:9px 6px;border:1px solid #46506d;border-radius:10px;background:#101322;color:white;text-align:center;cursor:pointer}
.contact.active,.group-item.active{border:2px solid #ffca28}
.contact img{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px}
.contact span{display:block;font-size:12px;overflow-wrap:anywhere}
.contact-presence{display:flex!important;align-items:center;justify-content:center;gap:4px;margin-top:5px;color:#aeb8d0}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.offline-dot{width:8px;height:8px;border-radius:50%;background:#8992a8;display:inline-block}
.unread-badge{display:inline-flex!important;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin:6px auto 0;border-radius:20px;background:#ffca28;color:#101322;font-size:11px!important;font-weight:bold}
.group-item small{display:block;color:#aeb8d0;margin-top:5px}
.group-controls{display:flex;gap:8px;flex-wrap:wrap}
.small-button{border:0;border-radius:8px;padding:10px 12px;background:#ffca28;color:#101322;font-weight:bold;cursor:pointer}
#conversationTitle{padding:11px;text-align:center;color:#ffca28;background:#19233b;font-weight:bold;border-bottom:1px solid #303957}
#typingIndicator{min-height:22px;padding:4px 12px;text-align:center;color:#65aaff;font-size:12px;background:#19233b}
#messages{flex:1;overflow-y:auto;padding:15px;min-height:250px;background:#101322}
.message{margin-bottom:15px}
.message.mine{text-align:right}
.name{font-size:12px;color:#aeb8d0;margin-bottom:4px}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
.bubble{display:inline-block;max-width:75%;padding:10px 14px;border-radius:16px;background:#303957;color:white;word-break:break-word;text-align:left}
.mine .bubble{background:#ffca28;color:#101322}
.chat-media{display:block;max-width:85%;width:auto;height:auto;max-height:350px;border-radius:12px;margin-top:7px}
.mine .chat-media{margin-left:auto}
.chat-audio{display:block;width:85%;max-width:300px;margin-top:8px}
.mine .chat-audio{margin-left:auto}
.message-meta{font-size:11px;color:#aeb8d0;margin-top:5px}
.read-ticks{color:#aeb8d0;font-weight:bold;margin-left:5px}
.read-ticks.read{color:#36a9ff}
.message-actions{display:flex;gap:7px;margin-top:6px;justify-content:flex-start}
.mine .message-actions{justify-content:flex-end}
.message-actions button{border:1px solid #46506d;background:#19233b;color:#ffca28;border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer}
.media-tools{padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #303957;background:#19233b}
.media-tools button,.media-tools label{border:0;border-radius:9px;padding:11px 13px;background:#ffca28;color:#101322;font-weight:bold;font-size:13px;cursor:pointer}
.media-tools #stopRecordButton{background:#dc2626;color:white}
#mediaPreview{padding:0 12px;background:#101322}
#mediaPreview img,#mediaPreview video{max-width:100%;max-height:180px;border-radius:10px}
#mediaStatus{font-size:12px;color:#ffca28;padding:5px 12px}
.send-box{display:flex;padding:12px;border-top:1px solid #303957;gap:8px;position:sticky;bottom:0;background:#19233b}
#messageInput{flex:1;min-width:0;border:1px solid #46506d;border-radius:25px;padding:12px;font-size:15px;background:#101322;color:white}
#messageInput::placeholder{color:#aeb8d0}
#sendButton{border:0;border-radius:25px;padding:0 18px;background:#ffca28;color:#101322;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
@media(max-width:400px){
.top-nav button{font-size:13px;padding:7px 5px}
.media-tools button,.media-tools label{font-size:12px;padding:10px}
}
</style>
</head>

<body>

<div class="top-nav">
<button onclick="goHome()">🏠 Home</button>
<button onclick="goChat()">💬 Chat</button>
<button onclick="goGames()">🎮 Games</button>
<button onclick="goTrending()">🔥 Trending</button>
<button onclick="goScores()">🏆 Scores</button>
<button onclick="window.location.href='/profile.html'">👤 Profile</button>
</div>

<div class="app">

<div class="profile">
<img id="profileAvatar" src="https://ui-avatars.com/api/?name=BigVic" alt="Profile photo">
<div>
<div id="profileName" class="profile-name">BigVic</div>
<label for="photoInput" class="photo-button">Change photo</label>
<input id="photoInput" type="file" accept="image/*" hidden>
</div>
</div>

<div class="header">
<h2>BigVic Fun 💬</h2>
<button id="logoutButton">Logout</button>
</div>

<div id="status" class="status">Starting BigVic Chat...</div>

<div class="chat-switch">
<button id="publicButton" class="active">🌍 Public Chat</button>
<button id="privateButton">🔒 Private Chat</button>
<button id="groupButton">👥 Group Chat</button>
</div>

<div id="contactsPanel" hidden>
<div class="panel-title">👥 Choose someone to chat with</div>
<div id="contactsList">
<span class="name">Loading contacts...</span>
</div>
</div>

<div id="groupsPanel" hidden>
<div class="panel-title">👥 My Groups</div>
<div class="group-controls">
<button id="createGroupButton" class="small-button">＋ Create Group</button>
<button id="addGroupMemberButton" class="small-button" hidden>＋ Add Member</button>
</div>
<div id="groupsList">Loading groups...</div>
</div>

<div id="conversationTitle">🌍 Public Chat</div>
<div id="typingIndicator"></div>
<div id="messages"></div>

<div id="mediaPreview"></div>
<div id="mediaStatus"></div>

<div class="media-tools">
<label for="chatMediaInput">📸 Photo / Video</label>
<input id="chatMediaInput" type="file" accept="image/*,video/*" hidden>
<button id="sendMediaButton" disabled>Send Media</button>
<button id="startRecordButton">🎤 Record Voice</button>
<button id="stopRecordButton" disabled>⏹ Stop & Send</button>
</div>

<div class="send-box">
<input id="messageInput" type="text" placeholder="Type a message..." maxlength="3000">
<button id="sendButton">Send</button>
</div>

</div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const statusBox=document.getElementById("status");
const messagesBox=document.getElementById("messages");
const messageInput=document.getElementById("messageInput");
const sendButton=document.getElementById("sendButton");
const logoutButton=document.getElementById("logoutButton");
const profileAvatar=document.getElementById("profileAvatar");
const profileName=document.getElementById("profileName");
const photoInput=document.getElementById("photoInput");

const publicButton=document.getElementById("publicButton");
const privateButton=document.getElementById("privateButton");
const groupButton=document.getElementById("groupButton");
const contactsPanel=document.getElementById("contactsPanel");
const contactsList=document.getElementById("contactsList");
const groupsPanel=document.getElementById("groupsPanel");
const groupsList=document.getElementById("groupsList");
const createGroupButton=document.getElementById("createGroupButton");
const addGroupMemberButton=document.getElementById("addGroupMemberButton");

const conversationTitle=document.getElementById("conversationTitle");
const typingIndicator=document.getElementById("typingIndicator");

const chatMediaInput=document.getElementById("chatMediaInput");
const sendMediaButton=document.getElementById("sendMediaButton");
const startRecordButton=document.getElementById("startRecordButton");
const stopRecordButton=document.getElementById("stopRecordButton");
const mediaPreview=document.getElementById("mediaPreview");
const mediaStatus=document.getElementById("mediaStatus");

let supabaseClient;
let currentUser;
let contacts=[];
let activeContact=null;
let activeGroup=null;
let myGroups=[];
let chatMode="public";

let selectedMedia=null;
let mediaRecorder=null;
let audioChunks=[];
let recordingStream=null;
let previewURL=null;
let refreshTimer=null;
let typingSendTimer=null;
let unreadCounts={};
let lastTypingUpdate=0;

let username=localStorage.getItem("bigvic_username")||"BigVic";

function goHome(){window.location.href="/";}
function goChat(){window.location.href="/chat/";}
function goGames(){window.location.href="/?page=games";}
function goTrending(){window.location.href="/?page=trending";}
function goScores(){window.location.href="/?page=scores";}

function avatarURL(name){
return "https://ui-avatars.com/api/?name="+
encodeURIComponent(name||"BigVic")+
"&background=303957&color=ffca28";
}

/* PROFILE */

profileName.textContent=username;

const changeNameButton=document.createElement("button");
changeNameButton.textContent="Change name";
changeNameButton.style.marginTop="6px";
changeNameButton.style.marginLeft="6px";
changeNameButton.style.padding="6px 9px";
changeNameButton.style.border="0";
changeNameButton.style.borderRadius="6px";
changeNameButton.style.background="#ffca28";
changeNameButton.style.color="#101322";
changeNameButton.style.fontSize="12px";

changeNameButton.onclick=async function(){
const newName=prompt("Enter your BigVic name:",username);
if(!newName||!newName.trim())return;

username=newName.trim();
localStorage.setItem("bigvic_username",username);
profileName.textContent=username;

if(currentUser){
const result=await supabaseClient.from("profiles").upsert({
id:currentUser.id,
username:username
});

if(result.error){
console.error(result.error);
alert("Name saved on this device, but profile update failed.");
}else{
await loadContacts();
}
}
};

profileName.parentElement.appendChild(changeNameButton);

const savedAvatar=localStorage.getItem("bigvic_avatar");
if(savedAvatar)profileAvatar.src=savedAvatar;

/* CONNECTION */

if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase){
statusBox.textContent="BigVic setup error. Check your configuration.";
}else{
supabaseClient=window.supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_ANON_KEY
);
startChat();
}

/* START CHAT */

async function startChat(){
try{
statusBox.textContent="Checking login...";

const result=await supabaseClient.auth.getUser();
if(result.error)throw result.error;

currentUser=result.data.user;

if(!currentUser){
window.location.href="/auth.html";
return;
}

await updatePresence();
await loadContacts();
await loadGroups();
await loadMessages();

statusBox.textContent="Connected to BigVic Chat";

if(refreshTimer)clearInterval(refreshTimer);

refreshTimer=setInterval(async function(){
await updatePresence();
await loadUnreadCounts();
await refreshTypingIndicator();

if(chatMode==="private"&&activeContact){
await loadMessages();
}

if(chatMode==="group"&&activeGroup){
await loadMessages();
}

if(chatMode==="group"){
await loadGroups();
}

},4000);

}catch(error){
console.error(error);
statusBox.textContent="Connection error: "+error.message;
}
}

/* ONLINE PRESENCE */

async function updatePresence(){
if(!currentUser)return;

const result=await supabaseClient
.from("profiles")
.update({last_seen:new Date().toISOString()})
.eq("id",currentUser.id);

if(result.error)console.error("Presence update:",result.error);
}

/* CONTACTS */

async function loadContacts(){
const result=await supabaseClient
.from("profiles")
.select("id,username,avatar,last_seen")
.order("username",{ascending:true});

if(result.error){
console.error(result.error);
contactsList.textContent="Could not load contacts. Check profile permissions.";
return;
}

contacts=(result.data||[]).filter(function(person){
return person.id!==currentUser.id;
});

await loadUnreadCounts();
renderContacts();
}

function isOnline(person){
if(!person.last_seen)return false;
return Date.now()-new Date(person.last_seen).getTime()<60000;
}

function renderContacts(){
contactsList.innerHTML="";

if(contacts.length===0){
contactsList.textContent="No other registered users yet.";
return;
}

contacts.forEach(function(person){
const button=document.createElement("button");
button.className="contact";
button.dataset.id=person.id;

const image=document.createElement("img");
image.src=person.avatar||avatarURL(person.username);
image.alt="";

const name=document.createElement("span");
name.textContent=person.username||"BigVic User";

const presence=document.createElement("span");
presence.className="contact-presence";

const dot=document.createElement("i");
dot.className=isOnline(person)?"online-dot":"offline-dot";

const label=document.createElement("span");
label.textContent=isOnline(person)?"Online":"Offline";

presence.append(dot,label);
button.append(image,name,presence);

const unread=unreadCounts[person.id]||0;

if(unread>0){
const badge=document.createElement("span");
badge.className="unread-badge";
badge.textContent=unread>99?"99+":unread;
button.appendChild(badge);
}

button.addEventListener("click",function(){
selectContact(person);
});

contactsList.appendChild(button);
});

updateContactSelection();
}

/* UNREAD COUNTS */

async function loadUnreadCounts(){
if(!currentUser)return;

const result=await supabaseClient
.from("messages")
.select("sender")
.eq("receiver",currentUser.id)
.is("read_at",null);

if(result.error){
console.error("Unread count error:",result.error);
return;
}

const counts={};

(result.data||[]).forEach(function(item){
counts[item.sender]=(counts[item.sender]||0)+1;
});

unreadCounts=counts;
}

/* SELECT CONTACT */

async function selectContact(person){
await stopTyping();

activeContact=person;
activeGroup=null;
chatMode="private";

setModeButtons();
contactsPanel.hidden=false;
groupsPanel.hidden=true;

conversationTitle.textContent="🔒 Private chat with "+(person.username||"BigVic User");
messageInput.placeholder="Message "+(person.username||"this user")+" privately...";

updateContactSelection();
await loadMessages();
await refreshTypingIndicator();
}

function updateContactSelection(){
document.querySelectorAll(".contact").forEach(function(button){
button.classList.toggle(
"active",
!!activeContact&&button.dataset.id===activeContact.id
);
});
}

function setModeButtons(){
publicButton.classList.toggle("active",chatMode==="public");
privateButton.classList.toggle("active",chatMode==="private");
groupButton.classList.toggle("active",chatMode==="group");
}

/* PUBLIC CHAT */

publicButton.addEventListener("click",async function(){
await stopTyping();

chatMode="public";
activeContact=null;
activeGroup=null;

setModeButtons();
contactsPanel.hidden=true;
groupsPanel.hidden=true;

conversationTitle.textContent="🌍 Public Chat";
messageInput.placeholder="Type a public message...";

typingIndicator.textContent="";
updateContactSelection();
await loadMessages();
});

/* PRIVATE CHAT */

privateButton.addEventListener("click",async function(){
await stopTyping();

chatMode="private";
activeGroup=null;

setModeButtons();
contactsPanel.hidden=false;
groupsPanel.hidden=true;

conversationTitle.textContent=activeContact
?"🔒 Private chat with "+activeContact.username
:"🔒 Choose a contact";

if(!activeContact){
messagesBox.innerHTML="";
typingIndicator.textContent="";

const info=document.createElement("p");
info.style.textAlign="center";
info.style.color="#aeb8d0";
info.textContent="Choose someone above to start a private conversation.";
messagesBox.appendChild(info);
}else{
await loadMessages();
await refreshTypingIndicator();
}

updateContactSelection();
await loadUnreadCounts();
});

/* GROUP CHAT MODE */

groupButton.addEventListener("click",async function(){
await stopTyping();

chatMode="group";
activeContact=null;

setModeButtons();
contactsPanel.hidden=true;
groupsPanel.hidden=false;

messageInput.placeholder="Message your group...";
conversationTitle.textContent=activeGroup
?"👥 "+activeGroup.name
:"👥 Choose a group";

await loadGroups();

if(activeGroup){
await loadMessages();
}else{
messagesBox.innerHTML="";
showEmptyMessage("Choose a group or create a new one.");
}
});

/* GROUPS: LOAD MY GROUPS */

async function loadGroups(){
if(!currentUser)return;

const membershipResult=await supabaseClient
.from("group_members")
.select("group_id,role")
.eq("user_id",currentUser.id);

if(membershipResult.error){
console.error("Group membership error:",membershipResult.error);
groupsList.textContent="Could not load groups: "+membershipResult.error.message;
return;
}

const memberships=membershipResult.data||[];
const ids=memberships.map(function(item){return item.group_id;});

if(ids.length===0){
myGroups=[];
groupsList.innerHTML="";

const empty=document.createElement("span");
empty.className="name";
empty.textContent="You haven't joined any groups yet.";
groupsList.appendChild(empty);

activeGroup=null;
addGroupMemberButton.hidden=true;
return;
}

const result=await supabaseClient
.from("chat_groups")
.select("id,name,description,created_by,created_at")
.in("id",ids)
.order("created_at",{ascending:false});

if(result.error){
console.error("Groups error:",result.error);
groupsList.textContent="Could not load groups: "+result.error.message;
return;
}

myGroups=result.data||[];
renderGroups();
}

/* DISPLAY GROUPS */

function renderGroups(){
groupsList.innerHTML="";

if(!myGroups.length){
groupsList.textContent="No groups yet.";
return;
}

myGroups.forEach(function(group){
const button=document.createElement("button");
button.className="group-item";
button.dataset.id=group.id;

const title=document.createElement("strong");
title.textContent="👥 "+group.name;

const small=document.createElement("small");
small.textContent=group.description||"BigVic group";

button.append(title,small);

if(activeGroup&&activeGroup.id===group.id){
button.classList.add("active");
}

button.addEventListener("click",function(){
selectGroup(group);
});

groupsList.appendChild(button);
});
}

/* SELECT GROUP */

async function selectGroup(group){
await stopTyping();

activeGroup=group;
activeContact=null;
chatMode="group";

setModeButtons();
contactsPanel.hidden=true;
groupsPanel.hidden=false;

conversationTitle.textContent="👥 "+group.name;
messageInput.placeholder="Message "+group.name+"...";

addGroupMemberButton.hidden=group.created_by!==currentUser.id;

renderGroups();
await loadMessages();
await refreshTypingIndicator();
}

/* CREATE GROUP */

createGroupButton.addEventListener("click",createGroup);

async function createGroup(){
if(!currentUser)return;

const name=prompt("Enter a name for your group:");

if(!name||!name.trim())return;

const description=prompt("Enter a short group description (optional):")||"";

createGroupButton.disabled=true;
createGroupButton.textContent="Creating...";

try{
const groupResult=await supabaseClient
.from("chat_groups")
.insert({
name:name.trim(),
description:description.trim(),
created_by:currentUser.id
})
.select("id,name,description,created_by,created_at")
.single();

if(groupResult.error)throw groupResult.error;

const group=groupResult.data;

const memberResult=await supabaseClient
.from("group_members")
.insert({
group_id:group.id,
user_id:currentUser.id,
role:"admin"
});

if(memberResult.error)throw memberResult.error;

chatMode="group";
activeContact=null;
activeGroup=group;

setModeButtons();
contactsPanel.hidden=true;
groupsPanel.hidden=false;

await loadGroups();
await selectGroup(group);

alert("Your group has been created successfully! 🎉");

}catch(error){
console.error("Create group error:",error);
alert("Could not create group: "+error.message);
}finally{
createGroupButton.disabled=false;
createGroupButton.textContent="＋ Create Group";
}
}

/* ADD A GROUP MEMBER */

addGroupMemberButton.addEventListener("click",addGroupMember);

async function addGroupMember(){
if(!activeGroup)return;

if(activeGroup.created_by!==currentUser.id){
alert("Only the group creator can add members right now.");
return;
}

if(!contacts.length){
alert("There are no other registered users to add yet.");
return;
}

const available=contacts.map(function(person){
return person.username+" ("+person.email+")";
});

const choice=prompt(
"Enter the exact username of the person to add:\n\n"+
available.join("\n")
);

if(!choice||!choice.trim())return;

const person=contacts.find(function(item){
return (item.username||"").toLowerCase()===choice.trim().toLowerCase();
});

if(!person){
alert("That username was not found. Please enter an exact username from the list.");
return;
}

try{
const existing=await supabaseClient
.from("group_members")
.select("user_id")
.eq("group_id",activeGroup.id)
.eq("user_id",person.id)
.maybeSingle();

if(existing.error)throw existing.error;

if(existing.data){
alert(person.username+" is already in this group.");
return;
}

const result=await supabaseClient
.from("group_members")
.insert({
group_id:activeGroup.id,
user_id:person.id,
role:"member"
});

if(result.error)throw result.error;

alert(person.username+" was added to the group! 🎉");
await showGroupMembers();
}catch(error){
console.error("Add member error:",error);
alert("Could not add member: "+error.message);
}
}

/* SHOW GROUP MEMBERS */

async function showGroupMembers(){
if(!activeGroup)return;

const result=await supabaseClient
.from("group_members")
.select("user_id")
.eq("group_id",activeGroup.id);

if(result.error){
alert("Could not load group members: "+result.error.message);
return;
}

const names=(result.data||[]).map(function(member){
if(member.user_id===currentUser.id)return username;

const person=contacts.find(function(c){
return c.id===member.user_id;
});

return person?.username||"BigVic User";
});

alert("Members of "+activeGroup.name+":\n\n"+names.join("\n"));
}

/* GROUP MESSAGE READ/WRITE */

async function loadGroupMessages(){
if(!activeGroup)return;

const result=await supabaseClient
.from("group_messages")
.select("*")
.eq("group_id",activeGroup.id)
.order("created_at",{ascending:true})
.limit(200);

if(result.error){
console.error("Group messages error:",result.error);
statusBox.textContent="Group message error: "+result.error.message;
return;
}

messagesBox.innerHTML="";

if(!result.data||result.data.length===0){
showEmptyMessage("No messages in this group yet. Say hello! 👋");
}else{
result.data.forEach(showMessage);
}

messagesBox.scrollTop=messagesBox.scrollHeight;
statusBox.textContent="BigVic Fun Chat";
}

/* EMPTY CHAT MESSAGE */

function showEmptyMessage(text){
messagesBox.innerHTML="";
const empty=document.createElement("p");
empty.style.textAlign="center";
empty.style.color="#aeb8d0";
empty.textContent=text;
messagesBox.appendChild(empty);
}

/* MARK PRIVATE MESSAGES READ */

async function markConversationAsRead(){
if(chatMode!=="private"||!activeContact||!currentUser)return;

const result=await supabaseClient
.from("messages")
.update({read_at:new Date().toISOString()})
.eq("sender",activeContact.id)
.eq("receiver",currentUser.id)
.is("read_at",null);

if(result.error){
console.error("Could not mark messages as read:",result.error);
return;
}

await loadUnreadCounts();
renderContacts();
}

/* LOAD MESSAGES */

async function loadMessages(){
if(!currentUser)return;

if(chatMode==="group"){
await loadGroupMessages();
return;
}

let query=supabaseClient.from("messages").select("*");

if(chatMode==="public"){
query=query.eq("receiver","public");
}else{
if(!activeContact)return;

const otherId=activeContact.id;

query=query.or(
"and(sender.eq."+currentUser.id+
",receiver.eq."+otherId+
"),and(sender.eq."+otherId+
",receiver.eq."+currentUser.id+")"
);
}

const result=await query.order("created_at",{ascending:true}).limit(200);

if(result.error){
console.error(result.error);
statusBox.textContent="Messages error: "+result.error.message;
return;
}

messagesBox.innerHTML="";

if(!result.data||result.data.length===0){
showEmptyMessage(chatMode==="public"
?"No public messages yet. Say hello! 👋"
:"No private messages yet. Start the conversation! 💛");
}else{
result.data.forEach(showMessage);
}

statusBox.textContent="BigVic Fun Chat";
messagesBox.scrollTop=messagesBox.scrollHeight;

if(chatMode==="private"){
await markConversationAsRead();
}
}

/* DISPLAY MESSAGES, RECEIPTS, EDIT AND DELETE */

function showMessage(item){
const mine=item.sender===currentUser.id;

const wrapper=document.createElement("div");
wrapper.className=mine?"message mine":"message";

const person=contacts.find(function(contact){
return contact.id===item.sender;
});

const displayName=mine?username:(person?.username||"BigVic User");

const name=document.createElement("div");
name.className="name";
name.textContent=displayName;

const avatar=document.createElement("img");
avatar.className="avatar";
avatar.src=mine
?(localStorage.getItem("bigvic_avatar")||avatarURL(username))
:(person?.avatar||avatarURL(displayName));

wrapper.append(name,avatar);

if(item.message){
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=item.message;
wrapper.appendChild(bubble);
}

if(item.media_url){
let media;

if(item.media_type==="image"){
media=document.createElement("img");
media.alt="Shared picture";
}else if(item.media_type==="video"){
media=document.createElement("video");
media.controls=true;
media.preload="metadata";
media.playsInline=true;
}else if(item.media_type==="audio"){
media=document.createElement("audio");
media.controls=true;
media.preload="metadata";
}

if(media){
media.src=item.media_url;
media.className=item.media_type==="audio"?"chat-audio":"chat-media";
wrapper.appendChild(media);
}
}

const meta=document.createElement("div");
meta.className="message-meta";
meta.textContent=new Date(item.created_at).toLocaleString();

if(mine&&chatMode==="private"){
const ticks=document.createElement("span");
ticks.className=item.read_at?"read-ticks read":"read-ticks";
ticks.textContent="✓✓";
ticks.title=item.read_at?"Read":"Sent";
meta.appendChild(ticks);
}

wrapper.appendChild(meta);

if(mine){
const actions=document.createElement("div");
actions.className="message-actions";

if(item.message){
const editButton=document.createElement("button");
editButton.textContent="✏️ Edit";
editButton.onclick=function(){
editMessage(item);
};
actions.appendChild(editButton);
}

const deleteButton=document.createElement("button");
deleteButton.textContent="🗑️ Delete";
deleteButton.onclick=function(){
deleteMessage(item);
};
actions.appendChild(deleteButton);

wrapper.appendChild(actions);
}

messagesBox.appendChild(wrapper);
}

/* EDIT MESSAGE */

async function editMessage(item){
const updated=prompt("Edit your message:",item.message||"");

if(updated===null)return;

if(!updated.trim()){
alert("Message cannot be empty.");
return;
}

const table=chatMode==="group"?"group_messages":"messages";

let query=supabaseClient
.from(table)
.update({message:updated.trim()})
.eq("id",item.id)
.eq("sender",currentUser.id);

if(chatMode==="group"){
query=query.eq("group_id",activeGroup.id);
}

const result=await query;

if(result.error){
console.error(result.error);
alert("Could not edit message: "+result.error.message);
return;
}

await loadMessages();
}

/* DELETE MESSAGE */

async function deleteMessage(item){
if(!confirm("Are you sure you want to delete this message?"))return;

const table=chatMode==="group"?"group_messages":"messages";

let query=supabaseClient
.from(table)
.delete()
.eq("id",item.id)
.eq("sender",currentUser.id);

if(chatMode==="group"){
query=query.eq("group_id",activeGroup.id);
}

const result=await query;

if(result.error){
console.error(result.error);
alert("Could not delete message: "+result.error.message);
return;
}

await loadMessages();
}

/* TYPING INDICATOR */

function getTypingReceiver(){
if(chatMode==="private"){
return activeContact?activeContact.id:null;
}

if(chatMode==="group"){
return activeGroup?activeGroup.id:null;
}

return "public";
}

async function updateTyping(){
if(!currentUser)return;

const receiver=getTypingReceiver();
if(!receiver)return;

const now=Date.now();
if(now-lastTypingUpdate<1500)return;
lastTypingUpdate=now;

const result=await supabaseClient
.from("typing_status")
.upsert({
user_id:currentUser.id,
receiver_id:receiver,
chat_mode:chatMode,
updated_at:new Date().toISOString()
},{onConflict:"user_id"});

if(result.error)console.error("Typing update:",result.error);
}

async function stopTyping(){
if(!currentUser)return;

if(typingSendTimer){
clearTimeout(typingSendTimer);
typingSendTimer=null;
}

const result=await supabaseClient
.from("typing_status")
.delete()
.eq("user_id",currentUser.id);

if(result.error)console.error("Stop typing:",result.error);
}

messageInput.addEventListener("input",function(){
if(!messageInput.value.trim()){
stopTyping();
return;
}

if(typingSendTimer)clearTimeout(typingSendTimer);

typingSendTimer=setTimeout(function(){
updateTyping();
},400);
});

messageInput.addEventListener("blur",stopTyping);

async function refreshTypingIndicator(){
if(!currentUser)return;

const receiver=chatMode==="private"
?currentUser.id
:getTypingReceiver();

if(!receiver){
typingIndicator.textContent="";
return;
}

let query=supabaseClient
.from("typing_status")
.select("user_id,receiver_id,chat_mode,updated_at")
.eq("receiver_id",receiver)
.eq("chat_mode",chatMode)
.neq("user_id",currentUser.id)
.gte("updated_at",new Date(Date.now()-8000).toISOString());

if(chatMode==="private"&&activeContact){
query=query.eq("user_id",activeContact.id);
}

const result=await query;

if(result.error){
console.error("Typing indicator:",result.error);
return;
}

if(result.data&&result.data.length>0){
const person=contacts.find(function(c){
return c.id===result.data[0].user_id;
});

typingIndicator.textContent=(person?.username||"Someone")+" is typing...";
}else{
typingIndicator.textContent="";
}
}

/* SAVE MESSAGE */

async function saveChatMessage(text,media){
if(chatMode==="private"&&!activeContact){
throw new Error("Choose a contact first.");
}

if(chatMode==="group"&&!activeGroup){
throw new Error("Choose a group first.");
}

if(chatMode==="group"){
const result=await supabaseClient
.from("group_messages")
.insert({
group_id:activeGroup.id,
sender:currentUser.id,
message:text||"",
media_url:media?media.url:null,
media_type:media?media.type:null
});

if(result.error)throw result.error;
return;
}

const receiver=chatMode==="private"
?activeContact.id
:"public";

const result=await supabaseClient
.from("messages")
.insert({
sender:currentUser.id,
receiver:receiver,
message:text||"",
media_url:media?media.url:null,
media_type:media?media.type:null
});

if(result.error)throw result.error;
}

/* SEND TEXT */

async function sendMessage(){
const text=messageInput.value.trim();
if(!text)return;

if(!currentUser){
alert("You are not logged in.");
return;
}

if(chatMode==="private"&&!activeContact){
alert("Choose a contact first.");
return;
}

if(chatMode==="group"&&!activeGroup){
alert("Choose a group first.");
return;
}

sendButton.disabled=true;
sendButton.textContent="Sending...";

try{
await stopTyping();
await saveChatMessage(text,null);
messageInput.value="";
await loadMessages();
}catch(error){
console.error(error);
alert("Message failed: "+error.message);
}finally{
sendButton.disabled=false;
sendButton.textContent="Send";
}
}

sendButton.addEventListener("click",sendMessage);

messageInput.addEventListener("keydown",function(event){
if(event.key==="Enter"){
event.preventDefault();
sendMessage();
}
});

/* UPLOAD MEDIA */

async function uploadChatMedia(file){
const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const filePath=currentUser.id+"/"+Date.now()+"_"+safeName;

const result=await supabaseClient.storage
.from("bigvic-media")
.upload(filePath,file,{
upsert:false,
contentType:file.type||"application/octet-stream"
});

if(result.error)throw result.error;

const publicResult=supabaseClient.storage
.from("bigvic-media")
.getPublicUrl(filePath);

return publicResult.data.publicUrl;
}

/* SELECT PHOTO OR VIDEO */

chatMediaInput.addEventListener("change",function(event){
const file=event.target.files[0];

selectedMedia=null;
sendMediaButton.disabled=true;
mediaPreview.innerHTML="";

if(previewURL){
URL.revokeObjectURL(previewURL);
previewURL=null;
}

if(!file)return;

if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){
mediaStatus.textContent="Please choose a picture or video.";
chatMediaInput.value="";
return;
}

if(file.size>50*1024*1024){
mediaStatus.textContent="File is too large. Maximum size is 50 MB.";
chatMediaInput.value="";
return;
}

selectedMedia=file;
previewURL=URL.createObjectURL(file);

let preview;

if(file.type.startsWith("image/")){
preview=document.createElement("img");
preview.alt="Picture preview";
}else{
preview=document.createElement("video");
preview.controls=true;
}

preview.src=previewURL;
mediaPreview.appendChild(preview);

mediaStatus.textContent="Media ready to send.";
sendMediaButton.disabled=false;
});

/* SEND PHOTO OR VIDEO */

sendMediaButton.addEventListener("click",async function(){
if(!selectedMedia||!currentUser)return;

if(chatMode==="private"&&!activeContact){
alert("Choose a contact first.");
return;
}

if(chatMode==="group"&&!activeGroup){
alert("Choose a group first.");
return;
}

const file=selectedMedia;

sendMediaButton.disabled=true;
sendMediaButton.textContent="Uploading...";
mediaStatus.textContent="Uploading your media. Please wait...";

try{
const type=file.type.startsWith("image/")?"image":"video";
const url=await uploadChatMedia(file);

await saveChatMessage(messageInput.value.trim(),{
url:url,
type:type
});

messageInput.value="";
chatMediaInput.value="";
selectedMedia=null;
mediaPreview.innerHTML="";

if(previewURL){
URL.revokeObjectURL(previewURL);
previewURL=null;
}

mediaStatus.textContent="Media shared successfully! 🎉";
await loadMessages();

}catch(error){
console.error(error);
mediaStatus.textContent="Upload failed: "+error.message;
}finally{
sendMediaButton.disabled=!selectedMedia;
sendMediaButton.textContent="Send Media";
}
});

/* RECORD VOICE NOTES */

startRecordButton.addEventListener("click",async function(){
if(!currentUser)return;

if(chatMode==="private"&&!activeContact){
alert("Choose a contact first.");
return;
}

if(chatMode==="group"&&!activeGroup){
alert("Choose a group first.");
return;
}

if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
alert("Voice recording is not supported by this browser.");
return;
}

try{
recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
audioChunks=[];

const mimeTypes=[
"audio/webm;codecs=opus",
"audio/mp4",
"audio/webm"
];

let options={};

for(const type of mimeTypes){
if(MediaRecorder.isTypeSupported(type)){
options={mimeType:type};
break;
}
}

mediaRecorder=new MediaRecorder(recordingStream,options);

mediaRecorder.ondataavailable=function(event){
if(event.data&&event.data.size>0){
audioChunks.push(event.data);
}
};

mediaRecorder.onstop=async function(){
const mime=mediaRecorder.mimeType||"audio/webm";
const blob=new Blob(audioChunks,{type:mime});

recordingStream.getTracks().forEach(function(track){
track.stop();
});
recordingStream=null;

if(blob.size>50*1024*1024){
mediaStatus.textContent="Voice note is too large.";
return;
}

const extension=mime.includes("mp4")?"m4a":"webm";

const file=new File(
[blob],
"voice-note-"+Date.now()+"."+extension,
{type:mime}
);

mediaStatus.textContent="Uploading voice note...";

try{
const url=await uploadChatMedia(file);

await saveChatMessage("",{
url:url,
type:"audio"
});

mediaStatus.textContent="Voice note sent successfully! 🎤";
await loadMessages();

}catch(error){
console.error(error);
mediaStatus.textContent="Voice upload failed: "+error.message;
}
};

mediaRecorder.start();
startRecordButton.disabled=true;
stopRecordButton.disabled=false;
mediaStatus.textContent="🔴 Recording... Tap Stop & Send when finished.";

}catch(error){
console.error(error);
alert("Could not start recording. Please allow microphone access.");
}
});

/* STOP RECORDING */

stopRecordButton.addEventListener("click",function(){
if(mediaRecorder&&mediaRecorder.state!=="inactive"){
mediaRecorder.stop();
startRecordButton.disabled=false;
stopRecordButton.disabled=true;
mediaStatus.textContent="Finishing your voice note...";
}
});

/* PROFILE PHOTO */

photoInput.addEventListener("change",function(event){
const file=event.target.files[0];
if(!file)return;

if(!file.type.startsWith("image/")){
alert("Please choose an image.");
return;
}

if(file.size>2*1024*1024){
alert("Please choose an image smaller than 2 MB.");
return;
}

const reader=new FileReader();

reader.onload=function(e){
localStorage.setItem("bigvic_avatar",e.target.result);
profileAvatar.src=e.target.result;
};

reader.readAsDataURL(file);
});

/* LOGOUT */

logoutButton.addEventListener("click",async function(){
logoutButton.disabled=true;

try{
await stopTyping();

if(refreshTimer)clearInterval(refreshTimer);

if(recordingStream){
recordingStream.getTracks().forEach(function(track){
track.stop();
});
}

await supabaseClient.auth.signOut();
window.location.href="/auth.html";

}catch(error){
console.error(error);
alert("Could not log out. Please try again.");
logoutButton.disabled=false;
}
});
