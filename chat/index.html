<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BigVic Fun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .top {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      border: 0;
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .profile {
      padding: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-weight: bold;
      font-size: 17px;
    }

    .profile-email {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .change-photo {
      display: inline-block;
      margin-top: 7px;
      background: #2563eb;
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    #photoInput {
      display: none;
    }

    #status {
      padding: 8px 15px;
      font-size: 13px;
      color: #666;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 350px;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
      gap: 9px;
      align-items: flex-start;
    }

    .message.mine {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #ddd;
    }

    .bubble-area {
      max-width: 75%;
    }

    .sender {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .mine .sender {
      text-align: right;
    }

    .bubble
