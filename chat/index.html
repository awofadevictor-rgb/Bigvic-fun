
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101322">
<title>BigVic Fun - Messages</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#1c1e21}
button,input{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

:root{
  --navy:#101322;
  --navy2:#19233b;
  --gold:#ffca28;
}

.topbar{
  height:58px;background:var(--navy);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;color:white;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px #0002
}
.brand{font-size:21px;font-weight:bold;color:var(--gold)}
.navlinks{display:flex;gap:8px}
.navlinks button{
  border:0;background:transparent;color:white;
  padding:9px;border-radius:7px;font-weight:bold
}
.navlinks button:hover{background:#303957}

.layout{
  display:grid;grid-template-columns:330px 1fr;
  max-width:1250px;height:calc(100vh - 58px);
  margin:auto;background:white
}
.sidebar{
  border-right:1px solid #ddd;display:flex;flex-direction:column;
  min-width:0;background:white
}
.sidebar-head{padding:20px 16px 12px}
.sidebar-head h2{margin:0 0 15px;font-size:25px}
.search{
  width:100%;padding:12px 15px;border:0;
  border-radius:25px;background:#f0f2f5;outline:none
}
.friend-heading{
  padding:12px 16px;color:#65676b;font-weight:bold;font-size:13px
}
.friends-list{overflow-y:auto;flex:1}
.friend{
  display:flex;align-items:center;gap:12px;padding:11px 15px;
  cursor:pointer;border:0;background:white;width:100%;text-align:left
}
.friend:hover{background:#f0f2f5}
.friend.active{background:#e7f3ff}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar{
  width:52px;height:52px;border-radius:50%;object-fit:cover;
  background:#ddd
}
.friend-info{min-width:0;flex:1}
.friend-name{font-weight:bold;font-size:15px;color:#1c1e21}
.friend-last{
  color:#65676b;font-size:12px;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.empty-friends{padding:20px;color:#65676b;line-height:1.6}

.chat-area{
  display:flex;flex-direction:column;min-width:0;
  height:100%;background:#fff
}
.chat-header{
  min-height:75px;padding:12px 18px;border-bottom:1px solid #ddd;
  display:flex;align-items:center;gap:12px
}
.chat-header img{width:45px;height:45px;border-radius:50%;object-fit:cover}
.chat-person{font-weight:bold;font-size:16px}
.chat-subtitle{font-size:12px;color:#65676b;margin-top:4px}
.messages{
  flex:1;overflow-y:auto;padding:20px;
  background:#fff;display:flex;flex-direction:column;gap:10px
}
.welcome{
  margin:auto;text-align:center;color:#65676b;padding:25px
}
.welcome .big-icon{font-size:55px;margin-bottom:12px}
.welcome h2{color:#1c1e21}
.message-row{display:flex;align-items:flex-end;gap:7px}
.message-row.mine{justify-content:flex-end}
.message-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.bubble{
  max-width:min(70%,520px);padding:11px 15px;border-radius:18px;
  background:#e4e6eb;color:#1c1e21;overflow-wrap:anywhere;
  line-height:1.4
}
.mine .bubble{background:#0084ff;color:white}
.message-time{font-size:10px;color:#8a8d91;margin:3px 8px}
.shared-media{
  max-width:min(70%,420px);max-height:350px;
  display:block;border-radius:14px;margin-top:3px
}
.shared-audio{max-width:260px;width:100%;display:block;margin-top:5px}
.composer-area{border-top:1px solid #ddd;padding:12px 15px;background:white}
.preview{margin-bottom:10px}
.preview img,.preview video{max-width:180px;max-height:120px;border-radius:10px}
.preview button{
  border:0;border-radius:8px;padding:7px 10px;
  background:#eee;margin-left:8px
}
.composer{display:flex;align-items:center;gap:9px}
.composer input[type=text]{
  flex:1;min-width:0;border:0;outline:none;
  background:#f0f2f5;border-radius:25px;padding:13px 16px
}
.tool-button{
  width:42px;height:42px;border:0;border-radius:50%;
  background:#f0f2f5;color:#1877f2;font-size:20px
}
.send-button{
  border:0;border-radius:22px;background:#1877f2;
  color:white;padding:12px 20px;font-weight:bold
}
.send-button:disabled{opacity:.5}
.status{
  padding:8px 14px;font-size:12px;color:#65676b;
  min-height:28px
}
.mobile-back{display:none;border:0;background:none;font-size:22px}

@media(max-width:700px){
  .layout{display:block;height:calc(100vh - 58px)}
  .sidebar{height:100%;width:100%}
  .chat-area{height:100%;display:none}
  .layout.chat-open .sidebar{display:none}
  .layout.chat-open .chat-area{display:flex}
  .mobile-back{display:block}
  .navlinks button{font-size:12px;padding:7px 5px}
  .brand{font-size:18px}
  .bubble{max-width:82%}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">BigVic Fun</div>
  <nav class="navlinks">
    <button onclick="location.href='/'">🏠 Home</button>
    <button onclick="location.href='/profile.html'">👤 Profile</button>
    <button id="logoutButton">Logout</button>
  </nav>
</header>

<main class="layout" id="layout">

  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>Chats</h2>
      <input id="friendSearch" class="search" type="search"
        placeholder="Search friends...">
    </div>

    <div class="friend-heading">YOUR FRIENDS</div>
    <div id="friendsList" class="friends-list">
      <div class="empty-friends">Loading your friends...</div>
    </div>
  </aside>

  <section class="chat-area">

    <div class="chat-header">
      <button class="mobile-back" id="backButton">←</button>
      <img id="chatAvatar"
        src="https://ui-avatars.com/api/?name=BigVic" alt="Friend">
      <div>
        <div class="chat-person" id="chatName">Choose a friend</div>
        <div class="chat-subtitle" id="chatSubtitle">
          Your BigVic Fun conversations
        </div>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="welcome">
        <div class="big-icon">💬</div>
        <h2>Your messages</h2>
        <p>Select a friend on the left to start chatting.</p>
      </div>
    </div>

    <div class="composer-area">
      <div id="preview" class="preview"></div>

      <div class="composer">
        <label class="tool-button" for="mediaInput"
          title="Send photo or video"
          style="display:flex;align-items:center;justify-content:center">📎</label>

        <input id="mediaInput" type="file"
          accept="image/*,video/*" hidden>

        <button id="recordButton" class="tool-button"
          type="button" title="Record voice message">🎤</button>

        <input id="messageInput" type="text"
          maxlength="3000" placeholder="Write a message..."
          autocomplete="off">

        <button id="sendButton" class="send-button"
          type="button">Send</button>
      </div>

      <div id="status" class="status">Welcome to BigVic Fun.</div>
    </div>

  </section>
</main>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const $ = id => document.getElementById(id);

let supabaseClient = null;
let currentUser = null;
let currentFriend = null;
let friends = [];
let selectedMedia = null;
let mediaRecorder = null;
let recordingStream = null;
let recordedChunks = [];
let isRecording = false;
let refreshTimer = null;
let previewURL = null;

const STORAGE_BUCKET = "bigvic-media";

if (
  window.supabase &&
  window.SUPABASE_URL &&
  window.SUPABASE_ANON_KEY
) {
  supabaseClient = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );
}

function status(message) {
  $("status").textContent = message;
  console.log("BigVic Fun:", message);
}

function avatarUrl(person) {
  return person.avatar ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(person.username || "User");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showWelcome() {
  $("messages").innerHTML = `
    <div class="welcome">
      <div class="big-icon">💬</div>
      <h2>Your messages</h2>
      <p>Select a friend to start chatting.</p>
    </div>`;
}

function openChat(friend) {
  currentFriend = friend;

  $("chatName").textContent = friend.username || "Friend";
  $("chatAvatar").src = avatarUrl(friend);
  $("chatSubtitle").textContent = "BigVic Fun chat";

  document.querySelectorAll(".friend").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.friendId === friend.id
    );
  });

  $("layout").classList.add("chat-open");
  $("messageInput").focus();
  loadMessages();
}

function renderFriends() {
  const list = $("friendsList");
  const search = $("friendSearch").value.toLowerCase().trim();

  list.innerHTML = "";

  const visibleFriends = friends.filter(friend =>
    (friend.username || "Friend").toLowerCase().includes(search)
  );

  if (!visibleFriends.length) {
    list.innerHTML = `
      <div class="empty-friends">
        No friends found yet.<br><br>
        Add friends and accept their requests before chatting.
      </div>`;
    return;
  }

  visibleFriends.forEach(friend => {
    const button = document.createElement("button");
    button.className = "friend";
    button.dataset.friendId = friend.id;

    if (currentFriend && currentFriend.id === friend.id) {
      button.classList.add("active");
    }

    const img = document.createElement("img");
    img.className = "avatar";
    img.src = avatarUrl(friend);
    img.alt = "";

    const info = document.createElement("div");
    info.className = "friend-info";

    const name = document.createElement("div");
    name.className = "friend-name";
    name.textContent = friend.username || "Friend";

    const last = document.createElement("div");
    last.className = "friend-last";
    last.textContent = "Tap to open conversation";

    info.append(name, last);
    button.append(img, info);

    button.addEventListener("click", () => openChat(friend));
    list.appendChild(button);
  });
}

async function loadFriends() {
  if (!currentUser) return;

  status("Loading your friends...");

  const { data: requests, error } = await supabaseClient
    .from("friend_requests")
    .select("requester,recipient,status")
    .or(
      "requester.eq." + currentUser.id +
      ",recipient.eq." + currentUser.id
    );

  if (error) {
    status("Friends error: " + error.message);
    $("friendsList").innerHTML =
      '<div class="empty-friends">Could not load friends. Check your friend_requests table and permissions.</div>';
    return;
  }

  const acceptedIds = new Set();

  (requests || []).forEach(request => {
    if (request.status !== "accepted") return;

    const friendId = request.requester === currentUser.id
      ? request.recipient
      : request.requester;

    if (friendId) acceptedIds.add(friendId);
  });

  if (!acceptedIds.size) {
    friends = [];
    currentFriend = null;
    renderFriends();
    status("You don't have accepted friends yet.");
    return;
  }

  const { data: profiles, error: profileError } = await supabaseClient
    .from("profiles")
    .select("id,username,avatar")
    .in("id", Array.from(acceptedIds))
    .order("username");

  if (profileError) {
    status("Could not load friend profiles: " + profileError.message);
    return;
  }

  friends = profiles || [];
  renderFriends();
  status("Your friends are ready.");

  if (currentFriend) {
    const stillFriend = friends.find(f => f.id === currentFriend.id);

    if (!stillFriend) {
      currentFriend = null;
      showWelcome();
      $("chatName").textContent = "Choose a friend";
      $("chatAvatar").src =
        "https://ui-avatars.com/api/?name=BigVic";
      $("chatSubtitle").textContent =
        "Your BigVic Fun conversations";
      $("layout").classList.remove("chat-open");
    } else {
      currentFriend = stillFriend;
      $("chatAvatar").src = avatarUrl(stillFriend);
      $("chatName").textContent = stillFriend.username || "Friend";
    }
  }
}

function parseMessage(raw) {
  if (raw.startsWith("[image] ")) {
    return { type: "image", url: raw.slice(8) };
  }
  if (raw.startsWith("[video] ")) {
    return { type: "video", url: raw.slice(8) };
  }
  if (raw.startsWith("[voice] ")) {
    return { type: "voice", url: raw.slice(8) };
  }
  return { type: "text", text: raw };
}

async function loadMessages() {
  if (!currentUser || !currentFriend) return;

  const friendId = currentFriend.id;

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      "and(sender.eq." + currentUser.id +
      ",receiver.eq." + friendId +
      "),and(sender.eq." + friendId +
      ",receiver.eq." + currentUser.id + ")"
    )
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    status("Could not load messages: " + error.message);
    return;
  }

  if (!currentFriend || currentFriend.id !== friendId) return;

  const box = $("messages");
  box.innerHTML = "";

  if (!data || !data.length) {
    box.innerHTML = `
      <div class="welcome">
        <div class="big-icon">👋</div>
        <h2>Say hello!</h2>
        <p>Start your conversation with ${escapeHtml(currentFriend.username || "your friend")}.</p>
      </div>`;
    return;
  }

  data.forEach(message => displayMessage(message));
  box.scrollTop = box.scrollHeight;
}

function displayMessage(message) {
  const mine = message.sender === currentUser.id;
  const parsed = parseMessage(message.message || "");

  const row = document.createElement("div");
  row.className = "message-row" + (mine ? " mine" : "");

  if (!mine) {
    const img = document.createElement("img");
    img.className = "message-avatar";
    img.src = avatarUrl(currentFriend);
    row.appendChild(img);
  }

  const content = document.createElement("div");

  if (parsed.type === "text") {
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = parsed.text;
    content.appendChild(bubble);
  }

  if (parsed.type === "image") {
    const img = document.createElement("img");
    img.src = parsed.url;
    img.className = "shared-media";
    img.alt = "Shared photo";
    content.appendChild(img);
  }

  if (parsed.type === "video") {
    const video = document.createElement("video");
    video.src = parsed.url;
    video.controls = true;
    video.playsInline = true;
    video.className = "shared-media";
    content.appendChild(video);
  }

  if (parsed.type === "voice") {
    const audio = document.createElement("audio");
    audio.src = parsed.url;
    audio.controls = true;
    audio.className = "shared-audio";
    content.appendChild(audio);
  }

  const time = document.createElement("div");
  time.className = "message-time";
  time.textContent = message.created_at
    ? new Date(message.created_at).toLocaleString()
    : "";

  content.appendChild(time);
  row.appendChild(content);
  $("messages").appendChild(row);
}

async function uploadMedia(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = currentUser.id + "/" + Date.now() + "_" + safeName;

  const { error } = await supabaseClient.storage
    .from(STORAGE_BUCKET)
    .upload(path, file, {
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = supabaseClient.storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path);

  if (!data || !data.publicUrl) {
    throw new Error("Could not get the uploaded file URL.");
  }

  return data.publicUrl;
}

async function sendMessage() {
  if (!currentUser) {
    status("Please log in first.");
    return;
  }

  if (!currentFriend) {
    status("Choose a friend before sending a message.");
    return;
  }

  const text = $("messageInput").value.trim();
  let message = "";

  if (selectedMedia) {
    try {
      status("Uploading your media...");
      $("sendButton").disabled = true;

      const url = await uploadMedia(selectedMedia);

      if (selectedMedia.type.startsWith("image/")) {
        message = "[image] " + url;
      } else if (selectedMedia.type.startsWith("video/")) {
        message = "[video] " + url;
      } else if (selectedMedia.type.startsWith("audio/")) {
        message = "[voice] " + url;
      } else {
        throw new Error("This file type is not supported.");
      }
    } catch (error) {
      status("Upload failed: " + error.message);
      $("sendButton").disabled = false;
      return;
    }
  } else {
    message = text;
  }

  if (!message) {
    status("Type a message or choose a photo, video or voice note.");
    $("sendButton").disabled = false;
    return;
  }

  const receiverId = currentFriend.id;

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      sender: currentUser.id,
      receiver: receiverId,
      message: message
    });

  $("sendButton").disabled = false;

  if (error) {
    status("Send failed: " + error.message);
    return;
  }

  $("messageInput").value = "";
  clearPreview();
  status("Message sent!");
  await loadMessages();
}

function clearPreview() {
  selectedMedia = null;
  $("mediaInput").value = "";
  $("preview").innerHTML = "";

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }
}

$("sendButton").addEventListener("click", sendMessage);

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});

$("friendSearch").addEventListener("input", renderFriends);

$("mediaInput").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  if (
    !file.type.startsWith("image/") &&
    !file.type.startsWith("video/")
  ) {
    status("Choose an image or video.");
    event.target.value = "";
    return;
  }

  clearPreview();
  selectedMedia = file;
  previewURL = URL.createObjectURL(file);

  if (file.type.startsWith("image/")) {
    $("preview").innerHTML =
      '<img src="' + previewURL + '" alt="Preview">';
  } else {
    $("preview").innerHTML =
      '<video src="' + previewURL + '" controls></video>';
  }

  const remove = document.createElement("button");
  remove.textContent = "Remove";
  remove.onclick = clearPreview;
  $("preview").appendChild(remove);

  status("Media ready to send.");
});

// Voice recording: tap once to start and tap again to stop.
$("recordButton").addEventListener("click", async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status("Voice recording needs HTTPS and microphone permission.");
    return;
  }

  if (!window.MediaRecorder) {
    status("Voice recording is not supported in this browser.");
    return;
  }

  if (isRecording && mediaRecorder) {
    mediaRecorder.stop();
    return;
  }

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(recordingStream);

    mediaRecorder.ondataavailable = event => {
      if (event.data && event.data.size) {
        recordedChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = () => {
      recordingStream.getTracks().forEach(track => track.stop());
      recordingStream = null;
      isRecording = false;
      $("recordButton").textContent = "🎤";

      const type = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(recordedChunks, { type });

      if (!blob.size) {
        status("No voice recording was captured.");
        return;
      }

      const extension = type.includes("mp4") ? "mp4" : "webm";

      selectedMedia = new File(
        [blob],
        "voice-note-" + Date.now() + "." + extension,
        { type }
      );

      $("preview").innerHTML = "";

      const audio = document.createElement("audio");
      previewURL = URL.createObjectURL(blob);
      audio.src = previewURL;
      audio.controls = true;
      $("preview").appendChild(audio);

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.onclick = clearPreview;
      $("preview").appendChild(remove);

      status("Voice note ready. Press Send to share it.");
    };

    mediaRecorder.start();
    isRecording = true;
    $("recordButton").textContent = "⏹";
    status("Recording voice message. Tap ⏹ to finish.");

  } catch (error) {
    status("Microphone error: " + error.message);

    if (recordingStream) {
      recordingStream.getTracks().forEach(track => track.stop());
      recordingStream = null;
    }
  }
});

$("backButton").addEventListener("click", () => {
  $("layout").classList.remove("chat-open");
});

$("logoutButton").addEventListener("click", async () => {
  if (!supabaseClient) return;

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    status("Logout failed: " + error.message);
    return;
  }

  location.href = "/auth.html";
});

async function startChat() {
  if (!supabaseClient) {
    status("Supabase connection failed. Check config.js.");
    return;
  }

  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    status(error.message);
    return;
  }

  currentUser = data.session?.user;

  if (!currentUser) {
    location.href = "/auth.html";
    return;
  }

  await loadFriends();
  showWelcome();

  if (refreshTimer) clearInterval(refreshTimer);

  refreshTimer = setInterval(() => {
    if (currentUser && !document.hidden) {
      loadFriends();
      if (currentFriend) loadMessages();
    }
  }, 10000);
}

document.addEventListener("DOMContentLoaded", startChat);
</script>

</body>
</html>
