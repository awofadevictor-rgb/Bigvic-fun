<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigVic Fun - Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

.card {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #00000015;
  text-align: center;
}

h1 { color: #111827; }

input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.secondary { background: #111827; }

.method {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.method button {
  margin: 0;
  background: #e5e7eb;
  color: #111827;
}

.method button.active {
  background: #2563eb;
  color: white;
}

#message {
  margin-top: 15px;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

a { color: #2563eb; }

.hidden { display: none; }
</style>
</head>

<body>

<div class="card">
  <h1>BigVic Fun 👋</h1>
  <p>Login or create your account</p>

  <div class="method">
    <button id="emailTab" class="active" onclick="selectMethod('email')">
      Email
    </button>

    <button id="phoneTab" onclick="selectMethod('phone')">
      Phone
    </button>
  </div>

  <input id="email" type="email" placeholder="Email address">

  <input
    id="phone"
    type="tel"
    placeholder="Phone number e.g. +2348012345678"
    class="hidden"
  >

  <input id="password" type="password" placeholder="Password">

  <button id="loginButton" onclick="login()">Login</button>

  <button id="registerButton" class="secondary" onclick="register()">
    Create Account
  </button>

  <div id="otpSection" class="hidden">
    <p>Enter the SMS verification code sent to your phone.</p>

    <input
      id="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="Enter SMS verification code"
    >

    <button onclick="verifyPhone()">
      Verify Phone Number
    </button>

    <button class="secondary" onclick="resendCode()">
      Resend Code
    </button>
  </div>

  <p id="message"></p>

  <p><a href="/">Back to Home</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<script>
let client = null;
let selectedMethod = "email";
let otpPhone = "";

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

function setup() {
  if (
    !window.supabase ||
    !window.SUPABASE_URL ||
    !window.SUPABASE_ANON_KEY
  ) {
    showMessage("Connection settings missing. Please check config.js.");
    return false;
  }

  if (!client) {
    client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );
  }

  return true;
}

function selectMethod(method) {
  selectedMethod = method;

  document.getElementById("emailTab").classList.toggle(
    "active", method === "email"
  );

  document.getElementById("phoneTab").classList.toggle(
    "active", method === "phone"
  );

  document.getElementById("email").classList.toggle(
    "hidden", method !== "email"
  );

  document.getElementById("phone").classList.toggle(
    "hidden", method !== "phone"
  );

  document.getElementById("otpSection").classList.add("hidden");

  showMessage("");

  document.getElementById("loginButton").textContent = "Login";

  document.getElementById("registerButton").textContent =
    "Create Account";
}

async function login() {
  if (!setup()) return;

  const password = document.getElementById("password").value;

  if (!password) {
    showMessage("Enter your password.");
    return;
  }

  if (selectedMethod === "email") {
    const email = document.getElementById("email").value.trim();

    if (!email) {
      showMessage("Enter your email address.");
      return;
    }

    showMessage("Logging in...");

    const { error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage("Login successful! Opening BigVic Fun...");

    window.location.href = "/chat/";
    return;
  }

  const phone = document.getElementById("phone").value.trim();

  if (!phone || !phone.startsWith("+")) {
    showMessage("Enter your phone number with country code, e.g. +234...");
    return;
  }

  showMessage("Logging in with your phone number...");

  const { error } = await client.auth.signInWithPassword({
    phone,
    password
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage("Login successful! Opening BigVic Fun...");

  window.location.href = "/chat/";
}

async function register() {
  if (!setup()) return;

  const password = document.getElementById("password").value;

  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.");
    return;
  }

  if (selectedMethod === "email") {
    const email = document.getElementById("email").value.trim();

    if (!email) {
      showMessage("Enter your email address.");
      return;
    }

    showMessage("Creating account...");

    const { data, error } = await client.auth.signUp({
      email,
      password
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    if (data.session) {
      showMessage("Account created! Opening BigVic Fun...");
      window.location.href = "/chat/";
    } else {
      showMessage(
        "Account created! Check your email to confirm, then log in."
      );
    }

    return;
  }

  const phone = document.getElementById("phone").value.trim();

  if (!phone || !phone.startsWith("+")) {
    showMessage("Enter your phone number with country code, e.g. +234...");
    return;
  }

  otpPhone = phone;

  showMessage("Sending SMS verification code...");

  const { error } = await client.auth.signUp({
    phone,
    password
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  document.getElementById("otpSection").classList.remove("hidden");

  document.getElementById("loginButton").classList.add("hidden");
  document.getElementById("registerButton").classList.add("hidden");

  showMessage(
    "Verification code sent! Check your SMS messages."
  );
}

async function verifyPhone() {
  if (!setup()) return;

  const token = document.getElementById("otp").value.trim();

  if (!token) {
    showMessage("Enter the SMS verification code.");
    return;
  }

  showMessage("Verifying your phone number...");

  const { data, error } = await client.auth.verifyOtp({
    phone: otpPhone,
    token,
    type: "sms"
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  if (data.session) {
    showMessage(
      "Phone number verified! Your account is ready. Opening BigVic Fun..."
    );

    window.location.href = "/chat/";
  } else {
    showMessage("Phone verified. Please log in.");
  }
}

async function resendCode() {
  if (!setup() || !otpPhone) return;

  showMessage("Sending a new verification code...");

  const { error } = await client.auth.resend({
    type: "sms",
    phone: otpPhone
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage("A new verification code has been sent!");
}
</script>

</body>
</html>
