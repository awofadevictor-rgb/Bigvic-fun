<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px 25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#6a11cb;
    margin:0;
}

.subtitle{
    text-align:center;
    color:#777;
    margin:8px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

.login{
    background:#6a11cb;
    color:white;
}

.register{
    background:#2575fc;
    color:white;
}

.forgot{
    text-align:right;
    color:#6a11cb;
    font-size:14px;
    font-weight:bold;
    margin:10px 0;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#444;
}
</style>
</head>

<body>

<div class="card">

<h1>BigVic Fun</h1>

<div class="subtitle">
Chat • Games • Fun
</div>

<input
id="email"
type="email"
placeholder="Email address">

<input
id="password"
type="password"
placeholder="Password">

<div
class="forgot"
onclick="forgotPassword()">
Forgot password?
</div>

<button
class="login"
onclick="loginUser()">
Login
</button>

<button
class="register"
onclick="registerUser()">
Create Account
</button>

<div id="message" class="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<script>

function msg(text){
    document.getElementById("message").textContent = text;
}

function forgotPassword(){
    msg("Password reset is coming next.");
}
