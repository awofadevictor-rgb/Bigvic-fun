<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 30px 25px;
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  color: #6a11cb;
}

.subtitle {
  text-align: center;
  color: #777;
  margin: 6px 0 28px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.login {
  background: #6a11cb;
  color: white;
}

.register {
  background: #2575fc;
  color: white;
}

.reset {
  background: #6a11cb;
  color: white;
}

.back {
  background: #eee;
  color: #333;
}

.forgot {
  text-align: right;
  color: #6a11cb;
  font-weight: bold;
  font-size: 14px;
  margin: 10px 0;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.message {
  text-align: center;
  margin-top: 18px;
  color: #444;
  min-height: 20px;
  font-size: 14px;
}

.info {
  text-align: center;
  color: #777;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">BigVic Fun</div>

  <div class="subtitle">
    Chat • Games • Fun
  </div>

  <!-- LOGIN -->
  <div id="login
