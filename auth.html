
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigVic Fun - Login</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

.card {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #00000015;
  text-align: center;
}

h1 { color: #111827; }

input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #111827;
}

#message {
  margin-top: 15px;
  overflow-wrap: anywhere;
  font-size: 14px;
}

a { color: #2563eb; }
</style>
</head>

<body>

<div class="card">
  <h1>BigVic Fun 👋</h1>
  <p>Login or create your account</p>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button id="loginButton" onclick="login()">Login</button>
  <button id="registerButton" class="secondary" onclick="register()">Create Account</button>

  <p id="message"></p>

  <p><a href="/">Back to Home</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<script>
let client = null;

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

function setup() {
  if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
    showMessage("Connection settings missing. Please check config.js.");
    return false;
  }

  if (!client) {
    client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );
  }

  return true;
}

async function login() {
  if (!setup()) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  showMessage("Logging in...");

  const { error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage("Login successful! Opening BigVic Fun...");

  window.location.href = "/chat/";
}

async function register() {
  if (!setup()) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.");
    return;
  }

  showMessage("Creating account...");

  const { data, error } = await client.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  if (data.session) {
    showMessage("Account created! Opening BigVic Fun...");
    window.location.href = "/chat/";
  } else {
    showMessage("Account created! Check your email to confirm, then log in.");
  }
}
</script>

</body>
</html>
