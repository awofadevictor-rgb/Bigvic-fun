<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px 22px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 45px;
}

h1 {
  text-align: center;
  margin: 5px 0;
  color: #222;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #667eea;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 5px;
}

.login {
  background: #667eea;
  color: white;
}

.register {
  background: #eee;
  color: #333;
}

.forgot {
  display: block;
  text-align: right;
  margin: 0 0 14px;
  color: #667eea;
  font-size: 14px;
  cursor: pointer;
}

.forgot:hover {
  text-decoration: underline;
}

.back {
  background: #eee;
  color: #333;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  display: none;
  font-size: 14px;
}

.success {
  display: block;
  background: #e8f8ee;
  color: #18733b;
}

.error {
  display: block;
  background: #fdeaea;
  color: #a52828;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🎉</div>

  <h1>BigVic Fun</h1>

  <div class="subtitle">
    Chat • Games • Fun
  </div>


  <!-- LOGIN AREA -->

  <div id="loginArea">

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <div
      class="forgot"
      onclick="showForgot()">
      Forgot password?
    </div>

    <button
      class="login"
      onclick="login()">
      Login
    </button>

    <button
      class="register"
      onclick="register()">
      Create Account
    </button>

  </div>


  <!-- FORGOT PASSWORD AREA -->

  <div
    id="forgotArea"
    class="hidden">

    <h2 style="text-align:center;">
      Reset Password
    </h2>

    <p style="text-align:center;color:#777;font-size:14px;">
      Enter your email address and we'll send you a password reset link.
    </p>

    <input
      type="email"
      id="resetEmail"
      placeholder="Email address"
      autocomplete="email"
    >

    <button
      class="login"
      onclick="sendReset()">
      Send Reset Link
    </button>

    <button
      class="back"
      onclick="backToLogin()">
      Back to Login
    </button>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message">
  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
