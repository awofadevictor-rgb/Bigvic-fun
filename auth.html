
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigVic Fun</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}
.box {
  width: 100%;
  max-width: 400px;
  padding: 25px;
  background: #171720;
  border-radius: 18px;
  text-align: center;
}
h1 { color: #00e5ff; }
input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #00e5ff;
  color: #071018;
  font-size: 16px;
  font-weight: bold;
}
button:disabled { opacity: .5; }
#result {
  margin-top: 18px;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
</style>
</head>

<body>
<div class="box">
  <h1>BigVic Fun 💬</h1>
  <p>Create your account or log in.</p>

  <input id="email" type="email"
    placeholder="Enter your email" autocomplete="email">

  <input id="password" type="password"
    placeholder="Enter password (at least 6 characters)"
    autocomplete="current-password">

  <button id="signup" type="button">Create Account</button>
  <button id="login" type="button">Login</button>

  <p id="result">Ready to connect!</p>
</div>

<script>
(function () {
  const result = document.getElementById("result");
  const signup = document.getElementById("signup");
  const login = document.getElementById("login");

  function show(text) {
    result.textContent = text;
  }

  function credentials() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      show("Please enter your email and password.");
      return null;
    }

    if (password.length < 6) {
      show("Password must have at least 6 characters.");
      return null;
    }

    return { email, password };
  }

  let client;

  try {
    if (!window.supabase) {
      throw new Error("Supabase library did not load. Refresh the page.");
    }

    if (
      typeof SUPABASE_URL === "undefined" ||
      typeof SUPABASE_ANON_KEY === "undefined"
    ) {
      throw new Error("Your config.js settings are missing.");
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    show("Connection ready. You can create an account.");

  } catch (error) {
    show("Setup error: " + error.message);
    return;
  }

  async function run(action) {
    const details = credentials();
    if (!details) return;

    signup.disabled = true;
    login.disabled = true;
    show(action === "signup" ? "Creating account..." : "Logging in...");

    try {
      const response = action === "signup"
        ? await client.auth.signUp(details)
        : await client.auth.signInWithPassword(details);

      if (response.error) {
        show("Error: " + response.error.message);
        return;
      }

      if (action === "signup") {
        show(
          response.data.session
            ? "Account created! You can now log in."
            : "Account created! Check your email if confirmation is required."
        );
      } else {
        show("Login successful! Opening chat...");
        window.location.href = "chat.html";
      }

    } catch (error) {
      show("Connection error: " + error.message);
    } finally {
      signup.disabled = false;
      login.disabled = false;
    }
  }

  signup.addEventListener("click", function () {
    run("signup");
  });

  login.addEventListener("click", function () {
    run("login");
  });
})();
</script>
</body>
</html>
