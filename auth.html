<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);

    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 20px;
    padding: 30px 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #6a11cb;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 8px 0 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

.login {
    background: #6a11cb;
    color: white;
}

.register {
    background: #2575fc;
    color: white;
}

.forgot {
    text-align: right;
    color: #6a11cb;
    font-size: 14px;
    font-weight: bold;
    margin: 10px 0;
}

.message {
    text-align: center;
    margin-top: 18px;
    color: #444;
    min-height: 20px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        BigVic Fun
    </div>

    <div class="subtitle">
        Chat • Games • Fun
    </div>

    <!-- LOGIN -->

    <div id="loginBox">

        <input
            id="email"
            type="email"
            placeholder="Email address"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <div
            class="forgot"
            id="forgotButton">
            Forgot password?
        </div>

        <button
            class="login"
            id="loginButton">
            Login
        </button>

        <button
            class="register"
            id="registerButton">
            Create Account
        </button>

    </div>


    <!-- PASSWORD RESET -->

    <div id="reset
