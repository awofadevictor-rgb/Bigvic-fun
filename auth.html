<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigVic Fun</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

h1 {
  text-align: center;
  color: #6a11cb;
}

p {
  text-align: center;
  color: #777;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  color: white;
  background: #6a11cb;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

#forgot {
  text-align: right;
  color: #6a11cb;
  margin: 10px 0;
  cursor: pointer;
}

#reset {
  display: none;
}

#message {
  text-align: center;
  margin-top: 15px;
  color: #444;
}
</style>
</head>

<body>

<div class="card">

<h1>BigVic Fun</h1>

<p>Chat • Games • Fun</p>

<div id="login">

<input id="email" type="email" placeholder="Email address">

<input id="password" type="password" placeholder="Password">

<div id="forgot">Forgot password?</div>

<button id="loginBtn">Login</button>

<button id="registerBtn">Create Account</button>

</div>

<div id="reset">

<h2>Reset Password</h2>

<input
