<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun</title>

  <style>
    body {
      font-family: Arial;
      background: #6a11cb;
      padding: 30px;
      text-align: center;
    }

    .box {
      background: white;
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #6a11cb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">

<h1>BigVic Fun</h1>

<p>Chat • Games • Fun</p>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="testLogin()">Login</button>

<button onclick="testRegister()">Create Account</button>

<button onclick="testForgot()">Forgot Password</button>

<p id="result"></p>

</div>

<script>

function testLogin() {
  document.getElementById("result").textContent =
    "LOGIN BUTTON WORKS";
}

function testRegister() {
  document.getElementById("result").textContent =
    "CREATE ACCOUNT BUTTON WORKS";
}

function testForgot() {
  document.getElementById("result").textContent =
    "FORGOT PASSWORD BUTTON WORKS";
}

</script>

</body>
</html>
