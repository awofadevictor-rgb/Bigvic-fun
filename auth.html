<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 30px 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

h1 {
  text-align: center;
  color: #6a11cb;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #6a11cb;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.login-btn {
  background: #6a11cb;
  color: white;
}

.register-btn {
  background: #2575fc;
  color: white;
}

.forgot {
  display: block;
  text-align: right;
  color: #6a11cb;
  margin: 2px 0 15px;
  cursor: pointer;
  font-size: 14px;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #555;
}

.hidden {
  display: none;
}

.back {
  display: block;
  text-align: center;
  margin-top: 15px;
  color: #6a11cb;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

  <h1>BigVic Fun</h1>
  <div class="subtitle">Chat • Games • Fun</div>

  <!-- LOGIN -->
  <div id="loginSection">

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <span class="forgot" onclick="showForgot()">
      Forgot password?
    </span>

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <button class="register-btn" onclick="register()">
      Create Account
    </button>

  </div>

  <!-- FORGOT PASSWORD -->
  <div id="forgotSection" class="hidden">

    <h2 style="text-align:center;">Reset Password</h2>

    <p style="text-align:center;color:#777;">
      Enter your email and we'll send you a password reset link.
    </p>

    <input
      type="email"
      id="resetEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <button class="login-btn" onclick="sendReset()">
      Send Reset Link
    </button>

    <span class="back" onclick="backToLogin()">
      ← Back to Login
    </span>

  </div>

  <div id="message" class="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>

<script>

const client = window.supabaseClient;

if (!client) {
  document.getElementById("message").textContent =
    "Supabase connection is not available.";
}

function showForgot() {
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("forgotSection").classList.remove("hidden");
  document.getElementById("message").textContent = "";
}

function backToLogin() {
  document.getElementById("forgotSection").classList.add("hidden");
  document.getElementById("loginSection").classList.remove("hidden");
  document.getElementById("message").textContent = "";
}

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    document.getElementById("message").textContent =
      "Please enter your email and password.";
    return;
  }

  document.getElementById("message").textContent = "Logging in...";

  const { error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    document.getElementById("message").textContent =
      error.message;
    return;
  }

  window.location.href = "/chat/";
}

async function register() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    document.getElementById("message").textContent =
      "Please enter an email and password.";
    return;
  }
