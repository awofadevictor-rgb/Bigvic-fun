<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun - Login</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    width: 90%;
    max-width: 400px;
    text-align: center;
}

h1 {
    font-size: 34px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #444;
    border-radius: 8px;
    background: #1f2937;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
}

button:active {
    transform: scale(.98);
}

.link {
    background: transparent;
    color: #60a5fa;
}

#message {
    margin-top: 15px;
    min-height: 25px;
    color: #60a5fa;
}

#resetBox {
    display: none;
}
</style>
</head>

<body>

<div class="box">

<h1>BigVic Fun</h1>

<div class="subtitle">
Chat • Games • Fun
</div>

<div id="loginBox">

<input
id="email"
type="email"
placeholder="Email address">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<button onclick="createAccount()">
Create Account
</button>

<button class="link" onclick="showReset()">
Forgot password?
</button>

</div>


<div id="resetBox">

<input
id="resetEmail"
type="email"
placeholder="Enter your email">

<button onclick="sendReset()">
Send Reset Email
</button>

<button class="link" onclick="showLogin()">
Back to Login
</button>

</div>

<div id="message"></div>

</div>


<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- BigVic configuration -->
<script src="/config.js"></script>

let client = null;
