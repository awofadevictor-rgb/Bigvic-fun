<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigVic Fun - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #171720;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      color: #00e5ff;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 0;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #061018;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      color: #ccc;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>BigVic Fun</h1>

  <input
    id="email"
    type="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="new-password"
  >

  <button id="signupButton" type="button">
    Create Account
  </button>

  <button id="loginButton" type="button">
    Login
  </button>

  <div id="message"></div>
</div>

<script>
const messageBox = document.getElementById("message");
const signupButton = document.getElementById("signupButton");
const loginButton = document.getElementById("loginButton");

function showMessage(text) {
  messageBox.textContent = text;
}

function getCredentials() {
  return {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  };
}
