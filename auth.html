<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BigVic Fun - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 20px;
  padding: 28px 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 42px;
  margin-bottom: 5px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  color: #222;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: #eee;
  cursor: pointer;
  font-size: 15px;
}

.tab.active {
  background: #667eea;
  color: white;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #667eea;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #667eea;
  color: white;
  margin-top: 4px;
}

.primary:hover {
  opacity: 0.92;
}

.secondary {
  background: #eee;
  color: #333;
  margin-top: 10px;
}

.forgot {
  display: block;
  text-align: right;
  margin: 2px 0 15px;
  color: #667eea;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.forgot:hover {
  text-decoration: underline;
}

.hidden {
  display: none !important;
}

.message {
  margin
